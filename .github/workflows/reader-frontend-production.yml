name: Exact-artifact owner-held frontend production release

on:
  workflow_dispatch:
    inputs:
      promotion_only:
        description: Promote only the exact retained READY production deployment; no build/deploy
        required: true
        default: false
        type: boolean
      backend_provider_evidence:
        description: Exact authenticated UI receipt plus Railway-origin commit status; protected approval must bind its SHA256
        required: false
        default: ''
        type: string
      target_sha:
        description: Approved immutable admin-caller frontend artifact SHA (b3998d7)
        required: true
        type: string
      confirm_production:
        description: DEPLOY_PRODUCTION, or PROMOTE_EXISTING_READY when promotion_only is true
        required: true
        type: string

# Explicit dispatch consent is separate from code integration; default cannot promote.
      conditional_promotion:
        description: Allow ONE bounded promotion of this run's verified production deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Artifact identity is independent of the reviewed current-main release controller.
# Changing these pins requires a new reviewed release contract, not dispatch input.
env:
  FRONTEND_SHA: b3998d72f2e93bd99ffb1563c906c77e78aa5b49
  FRONTEND_TREE: 8708ec1a1d506fdf3c5e6af1dde6face3a98c1a1
  FRONTEND_REVIEW_SHA: b3998d72f2e93bd99ffb1563c906c77e78aa5b49
  FRONTEND_BASELINE_SHA: b2abea1c85cf5b38f248e4af4f3523e0ce1e7252
  BACKEND_SHA: 0f2bb1e728890f1f0e41ded9b12f07c76246bce0
  BACKEND_TREE: 2c7b9ce0f219ebdf12129bdcf4dd3faf07e22af5
  CONTROLLER_SHA: ${{ github.sha }}
  TARGET_SHA: ${{ inputs.target_sha }}
  CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
  CONDITIONAL_PROMOTION: ${{ inputs.conditional_promotion }}
  PROMOTION_ONLY: ${{ inputs.promotion_only }}
  RELEASE_EVENT: ${{ github.event_name }}
  BACKEND_PROVIDER_EVIDENCE_JSON: ${{ inputs.backend_provider_evidence }}

defaults:
  run:
    shell: bash

concurrency:
  group: reader-manual-frontend-production
  cancel-in-progress: false

jobs:
  backend_verify:
    name: Read-only serving backend verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify manual release authorization and clean source
        run: &controller_source_gate |
          set -euo pipefail
          [[ "$RELEASE_EVENT" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == 'ronik18/earnalism-digital-library' ]] || exit 1
          if [[ "${PROMOTION_ONLY:-false}" == 'true' ]]; then
            [[ "$CONFIRM_PRODUCTION" == 'PROMOTE_EXISTING_READY' && "$CONDITIONAL_PROMOTION" == 'true' ]] || exit 1
          else
            [[ "$CONFIRM_PRODUCTION" == 'DEPLOY_PRODUCTION' ]] || exit 1
          fi
          for value in "$TARGET_SHA" "$FRONTEND_SHA" "$FRONTEND_TREE" "$BACKEND_SHA" "$BACKEND_TREE" "$CONTROLLER_SHA" "$FRONTEND_REVIEW_SHA" "$FRONTEND_BASELINE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
          [[ "$TARGET_SHA" == "$FRONTEND_SHA" && "$GITHUB_SHA" == "$CONTROLLER_SHA" ]] || exit 1
          [[ "$BACKEND_SHA" != "$FRONTEND_SHA" && "$FRONTEND_SHA" != "$CONTROLLER_SHA" && "$BACKEND_SHA" != "$CONTROLLER_SHA" ]] || exit 1
          git fetch --no-tags origin main
          git fetch --no-tags origin "$FRONTEND_SHA"
          git fetch --no-tags origin "$FRONTEND_REVIEW_SHA"
          git fetch --no-tags origin "$FRONTEND_BASELINE_SHA"
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" && "$CONTROLLER_SHA" == "$(git rev-parse HEAD)" ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          git merge-base --is-ancestor "$BACKEND_SHA" "$FRONTEND_SHA"
          git merge-base --is-ancestor "$FRONTEND_SHA" "$CONTROLLER_SHA"
          git merge-base --is-ancestor "$FRONTEND_BASELINE_SHA" "$FRONTEND_REVIEW_SHA"
          git merge-base --is-ancestor "$FRONTEND_REVIEW_SHA" "$FRONTEND_SHA"
          [[ "$(git rev-parse "$FRONTEND_REVIEW_SHA:frontend")" == "$(git rev-parse "$FRONTEND_SHA:frontend")" ]] || exit 1
          [[ "$(git rev-parse "$FRONTEND_SHA^{tree}")" == "$FRONTEND_TREE" ]] || exit 1
          [[ "$(git rev-parse "$BACKEND_SHA:backend")" == "$BACKEND_TREE" ]] || exit 1
          [[ "$(git rev-parse "$FRONTEND_SHA:backend")" == "$BACKEND_TREE" ]] || exit 1
          [[ "$(git rev-parse "$CONTROLLER_SHA:backend")" == "$BACKEND_TREE" ]] || exit 1
          [[ "$(git rev-parse "$CONTROLLER_SHA:frontend")" == "$(git rev-parse "$FRONTEND_SHA:frontend")" ]] || exit 1
          # Normal merge CI is recorded on its reviewed second parent, not the merge SHA.
          controller_review_sha="$(git rev-parse --verify HEAD^2 2>/dev/null || git rev-parse HEAD)"
          [[ "$(git rev-parse "$controller_review_sha^{tree}")" == "$(git rev-parse HEAD^{tree})" ]] || exit 1
          echo "CONTROLLER_REVIEW_SHA=$controller_review_sha" >> "$GITHUB_ENV"
          echo "CONTROLLER_SHA=$CONTROLLER_SHA FRONTEND_SHA=$FRONTEND_SHA BACKEND_SHA=$BACKEND_SHA"
          echo 'RELEASE_SOURCE_CLEAN=YES'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install existing verification clients
        run: |
          if [[ -z "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then
            npm install -g @railway/cli@5.64.2
            python -m pip install pymongo==4.15.3
          fi

      - name: Verify actual HTTP and provider serving identity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          evidence_args=()
          if [[ -n "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then evidence_args+=(--operator-provider-evidence); fi
          python scripts/verify_backend_release.py "${evidence_args[@]}" --expected-sha "$BACKEND_SHA" \
            --project a8533934-35c4-463e-9f43-577a9ac391ee \
            --service 5af42e7e-f518-4f6a-b602-d9950866501f \
            --environment 580b250c-80ee-48ad-bfbe-fa4e31a6b378 \
            --backend-url https://api.theearnalism.com | tee "$RUNNER_TEMP/backend-identity.json"

      - name: Verify existing read-only startup prerequisites
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then
            python - <<'PYCODE'
          import json, os
          from scripts.verify_backend_release import frontend_only_scope
          if not frontend_only_scope(os.environ):
              raise SystemExit('Frontend-only applicability mismatch')
          print(json.dumps({'startup_database_snapshot': 'NOT_APPLICABLE_FRONTEND_ONLY',
                            'database_state_verified': False}))
          PYCODE
          else
          railway run --project a8533934-35c4-463e-9f43-577a9ac391ee \
            --service 5af42e7e-f518-4f6a-b602-d9950866501f \
            --environment 580b250c-80ee-48ad-bfbe-fa4e31a6b378 --no-local \
            python scripts/verify_reader_startup_readonly.py
          fi | tee "$RUNNER_TEMP/backend-startup.json"

      - name: Publish non-secret backend verification summary
        run: |
          cat "$RUNNER_TEMP/backend-identity.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/backend-startup.json" >> "$GITHUB_STEP_SUMMARY"

  deploy_frontend:
    name: Protected frontend deploy or retained production promotion
    timeout-minutes: ${{ inputs.promotion_only && 15 || 360 }}
    needs: backend_verify
    environment: reader-frontend-production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.backend_verify.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.vercel-check.outputs.enabled }}
      deployment_id: ${{ steps.alias-binding.outputs.deployment_id }}
      ready_at: ${{ steps.alias-binding.outputs.ready_at }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE || vars.VERCEL_SCOPE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Recheck exact main and clean deployment source
        run: *controller_source_gate

      # Empty until existing authorized operators supply real config/rollback receipts.
      # This variable is an operator attestation, not automatic live provider verification.
      - name: Verify operator config and rollback approval
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.READER_FRONTEND_RELEASE_APPROVAL_JSON || '' }}
        run: &operator_approval_gate |
          set -euo pipefail
          python3 - <<'PYCODE'
          import datetime, hashlib, json, os, re
          r = json.loads(os.environ.get('RELEASE_APPROVAL_JSON', ''))
          expected = {
              'schema': 'reader-frontend-release-approval.v1',
              'controller_sha': os.environ['CONTROLLER_SHA'],
              'frontend_sha': os.environ['FRONTEND_SHA'],
              'frontend_tree': os.environ['FRONTEND_TREE'],
              'backend_sha': os.environ['BACKEND_SHA'],
              'project_id': 'prj_kxPN55TOJ23lDgoXIXrvqHtzy607',
              'root_directory': 'frontend',
              'config_path': 'frontend/vercel.json',
              'config_sha256': '3fe071e9df7825404e57800dfaaebba611c190f62548836f5242ae336fc76a3b',
              'git_deployment_enabled': False,
              'rollback_deployment': 'dpl_5nrp6vYYMZurfhVde1Jbu3aofsfB',
              'rollback_method': 'vercel-instant-rollback',
              'rollback_eligible': True,
              'frontend_backend_config_compatible': True,
              'no_backend_restart': True,
              'approved': True,
          }
          if os.environ.get('PROMOTION_ONLY') == 'true':
              expected.update(release_mode='promotion-only',
                  rollback_deployment='dpl_6hzaPakeBuma2y4JB6CGyngzCKJf',
                  retained_deployment='dpl_5nrp6vYYMZurfhVde1Jbu3aofsfB',
                  creation_controller_sha='2dad58e388918c9ea74d75935ef5d3753d93f4f3',
                  conditional_rollback=True)
          for key, value in expected.items():
              if type(r.get(key)) is not type(value) or r[key] != value:
                  raise SystemExit('Release operator receipt binding mismatch: ' + key)
          for key in ('rollback_artifact_sha256', 'rollback_config_sha256', 'operator_evidence_sha256'):
              if not re.fullmatch(r'[0-9a-f]{64}', r.get(key, '')) or r[key] == '0' * 64:
                  raise SystemExit('Missing retained artifact/config/operator evidence digest')
          if not isinstance(r.get('rollback_operator'), str) or not r['rollback_operator'].strip():
              raise SystemExit('Missing authorized rollback operator')
          if os.environ.get('BACKEND_PROVIDER_EVIDENCE_JSON'):
              from scripts.verify_backend_release import verify_operator_provider_evidence, verify_protected_evidence_binding
              raw = os.environ['BACKEND_PROVIDER_EVIDENCE_JSON']
              verify_operator_provider_evidence(raw, os.environ['BACKEND_SHA'])
              verify_protected_evidence_binding(raw, os.environ['RELEASE_APPROVAL_JSON'])
          now = datetime.datetime.now(datetime.timezone.utc)
          issued = datetime.datetime.fromisoformat(r['approved_at'])
          expires = datetime.datetime.fromisoformat(r['expires_at'])
          if issued.tzinfo is None or expires.tzinfo is None or not issued <= now < expires or expires - issued > datetime.timedelta(hours=24):
              raise SystemExit('Release approval missing, expired or overlong')
          print('RELEASE_OPERATOR_RECEIPT_SHA256=' + hashlib.sha256(os.environ['RELEASE_APPROVAL_JSON'].encode()).hexdigest())
          PYCODE

      - name: Verify exact frontend review CI
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: &frontend_ci_gate |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'ronik18/earnalism-digital-library':
              raise SystemExit('Wrong release repository')
          # Retain six baseline reviews; bind the caller PR reviews by exact frontend-tree equality.
          workflows = ['blog-reader-owner-evidence.yml', 'earnalism-coordination-bridge.yml',
                       'pr469-postmerge-recovery-owner-evidence.yml', 'public-pages-owner-review.yml',
                       'regression.yml', 'seamless-brand-owner-review.yml']
          caller_workflows = ['blog-reader-owner-evidence.yml', 'earnalism-coordination-bridge.yml',
                              'regression.yml', 'seamless-brand-owner-review.yml']
          for required_sha, required_workflows in [(os.environ['FRONTEND_BASELINE_SHA'], workflows),
                                                   (os.environ['FRONTEND_REVIEW_SHA'], caller_workflows),
                                                   (os.environ['CONTROLLER_REVIEW_SHA'], ['regression.yml'])]:
              for workflow in required_workflows:
                  url = ('https://api.github.com/repos/' + repo + '/actions/workflows/' + workflow +
                         '/runs?head_sha=' + required_sha + '&per_page=100')
                  request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_TOKEN'],
                                                                'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      runs = json.load(response)['workflow_runs']
                  relevant = [run for run in runs if run.get('head_sha') == required_sha
                              and run.get('path', '').split('@')[0] == '.github/workflows/' + workflow
                              and run.get('event') == 'pull_request'
                              and run.get('head_repository', {}).get('full_name') == repo]
                  if not relevant:
                      raise SystemExit('Exact frontend review CI unavailable: ' + workflow)
                  latest = max(relevant, key=lambda run: (run['run_number'], run.get('run_attempt', 1)))
                  if latest.get('status') != 'completed' or latest.get('conclusion') != 'success':
                      raise SystemExit('Latest exact frontend review CI not successful: ' + workflow)
                  print('RELEASE_CI_SHA=' + required_sha + ' WORKFLOW=' + workflow + ' RUN=' + str(latest['id']))
          PYCODE

      - name: Prepare exact frontend artifact source
        if: inputs.promotion_only != true
        run: |
          set -euo pipefail
          FRONTEND_DIR="$RUNNER_TEMP/reader-frontend-source"
          printf 'FRONTEND_DIR=%s\n' "$FRONTEND_DIR" >> "$GITHUB_ENV"
          [[ ! -e "$FRONTEND_DIR" ]] || exit 1
          git worktree add --detach "$FRONTEND_DIR" "$FRONTEND_SHA"
          [[ "$(git -C "$FRONTEND_DIR" rev-parse HEAD)" == "$FRONTEND_SHA" ]] || exit 1
          [[ -z "$(git -C "$FRONTEND_DIR" status --porcelain --untracked-files=all)" ]] || exit 1

      - name: Check Vercel deploy scope and secrets
        id: vercel-check
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          [[ "${RELEASE_EVENT}" == 'workflow_dispatch' ]] || exit 1
          [[ "${VERCEL_PROJECT_ID}" == 'prj_kxPN55TOJ23lDgoXIXrvqHtzy607' ]] || exit 1
          [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]] || { echo 'Required production deployment credentials unavailable' >&2; exit 1; }
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Reverify serving backend after owner approval
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.READER_FRONTEND_RELEASE_APPROVAL_JSON || '' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then npm install -g @railway/cli@5.64.2; fi
          evidence_args=()
          if [[ -n "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then evidence_args+=(--operator-provider-evidence --require-protected-binding); fi
          python3 scripts/verify_backend_release.py "${evidence_args[@]}" --expected-sha "$BACKEND_SHA" \
            --project a8533934-35c4-463e-9f43-577a9ac391ee \
            --service 5af42e7e-f518-4f6a-b602-d9950866501f \
            --environment 580b250c-80ee-48ad-bfbe-fa4e31a6b378 \
            --backend-url https://api.theearnalism.com

      - name: Set up Node
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        uses: actions/setup-node@v6
        with:
          node-version: "20.20.2"

      - name: Install Vercel CLI
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        run: npm install -g vercel@63.1.2

      - name: Link Vercel project
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRONTEND_DIR"
          mkdir -p .vercel
          node - <<'NODE'
          const fs = require('fs');

          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }, null, 2)}\n`,
          );
          NODE

      - name: Build frontend for Vercel
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.READER_FRONTEND_RELEASE_APPROVAL_JSON || '' }}
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C "$FRONTEND_DIR" rev-parse HEAD)" == "$FRONTEND_SHA" ]] || exit 1
          [[ -z "$(git -C "$FRONTEND_DIR" status --porcelain --untracked-files=all)" ]] || exit 1
          echo "BUILD_SHA=$FRONTEND_SHA"
          echo 'BUILD_SOURCE_CLEAN=YES'
          generated_seo_dir="$RUNNER_TEMP/reader-generated-seo"
          python3 scripts/verify_isolated_seo_build.py --prepare --source-root "$FRONTEND_DIR" --generated-root "$generated_seo_dir" --expected-sha "$FRONTEND_SHA"
          python3 -m scripts.frontend_public_build --source-root "$FRONTEND_DIR" --generated-root "$generated_seo_dir" --receipt /tmp/vercel-public-build.json
          python3 "$GITHUB_WORKSPACE/scripts/verify_isolated_seo_build.py" --source-root "$FRONTEND_DIR" --generated-root "$generated_seo_dir" --expected-sha "$FRONTEND_SHA" --output /tmp/vercel-isolated-seo.json

      - name: Verify exact built dependency identities
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_build_dependency_identity.py" --source-root "$FRONTEND_DIR" --output /tmp/vercel-dependency-identity.json

      - name: Verify source and prebuilt function packaging
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        shell: bash
        run: |
          python3 -m unittest scripts.test_verify_vercel_packaging -v
          cd "$FRONTEND_DIR"
          vercel deploy --dry --format=json > /tmp/vercel-source-manifest.json
          python3 "$GITHUB_WORKSPACE/scripts/verify_vercel_packaging.py" --root "$FRONTEND_DIR" --manifest /tmp/vercel-source-manifest.json --output /tmp/vercel-source-packaging.json
          vercel deploy --prebuilt --prod --dry --format=json > /tmp/vercel-prebuilt-manifest.json
          python3 "$GITHUB_WORKSPACE/scripts/verify_vercel_packaging.py" --root "$FRONTEND_DIR" --manifest /tmp/vercel-prebuilt-manifest.json --prebuilt --compare /tmp/vercel-source-packaging.json --output /tmp/vercel-prebuilt-packaging.json

      - name: Publish function packaging evidence
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: vercel-function-packaging-${{ github.sha }}
          path: |
            /tmp/vercel-source-packaging.json
            /tmp/vercel-prebuilt-packaging.json
            /tmp/vercel-isolated-seo.json
            /tmp/vercel-dependency-identity.json
            /tmp/vercel-public-build.json

      - name: Recheck controller and artifact authorization before deployment
        run: *controller_source_gate

      - name: Recheck operator config and rollback approval before deployment
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.READER_FRONTEND_RELEASE_APPROVAL_JSON || '' }}
        run: *operator_approval_gate

      - name: Recheck exact frontend review CI before deployment
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: *frontend_ci_gate

      - name: Deploy frontend to Vercel production
        if: inputs.promotion_only != true && (steps.vercel-check.outputs.enabled == 'true')
        shell: bash
        env:
          RELEASE_APPROVAL_JSON: ${{ vars.READER_FRONTEND_RELEASE_APPROVAL_JSON || '' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          artifact_head="$(git -C "$FRONTEND_DIR" rev-parse HEAD)"
          if [[ "$artifact_head" != "$FRONTEND_SHA" ]]; then
            printf 'RELEASE_ARTIFACT_HEAD_MISMATCH expected=%s actual=%s\n' "$FRONTEND_SHA" "$artifact_head" >&2
            exit 1
          fi
          artifact_status="$(git -C "$FRONTEND_DIR" status --porcelain --untracked-files=all)"
          if [[ -n "$artifact_status" ]]; then
            printf 'RELEASE_ARTIFACT_DIRTY head=%s; refusing deployment\n' "$artifact_head" >&2
            printf '%s\n' "$artifact_status" >&2
            exit 1
          fi
          evidence_args=()
          if [[ -n "${BACKEND_PROVIDER_EVIDENCE_JSON:-}" ]]; then evidence_args+=(--operator-provider-evidence --require-protected-binding); fi
          python3 scripts/verify_backend_release.py "${evidence_args[@]}" --expected-sha "$BACKEND_SHA" \
            --project a8533934-35c4-463e-9f43-577a9ac391ee \
            --service 5af42e7e-f518-4f6a-b602-d9950866501f \
            --environment 580b250c-80ee-48ad-bfbe-fa4e31a6b378 \
            --backend-url https://api.theearnalism.com
          git fetch --no-tags origin main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" && "$CONTROLLER_SHA" == "$(git rev-parse HEAD)" ]] || exit 1
          python3 "$GITHUB_WORKSPACE/scripts/verify_build_dependency_identity.py" --source-root "$FRONTEND_DIR" --output /tmp/vercel-dependency-identity-predeploy.json
          python3 -m scripts.frontend_public_build --verify-only --source-root "$FRONTEND_DIR" --receipt /tmp/vercel-public-build.json
          cd "$FRONTEND_DIR"
          args=(deploy --prebuilt --prod --meta "githubCommitSha=$FRONTEND_SHA" --meta "readerControllerSha=$CONTROLLER_SHA" --meta "readerBackendSha=$BACKEND_SHA")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          deployment_url="$(vercel "${args[@]}")"
          DEPLOYMENT_URL="$deployment_url" python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ['DEPLOYMENT_URL']
          parsed = urlparse(value)
          assert parsed.scheme == 'https' and parsed.hostname.endswith('.vercel.app')
          assert not parsed.username and not parsed.password and parsed.path in ('', '/')
          assert not parsed.query and not parsed.fragment
          PY
          deployment_host="${deployment_url#https://}"
          vercel api "/v13/deployments/${deployment_host}" --method GET --raw > "$RUNNER_TEMP/frontend-deployment.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          deployment = json.loads((Path(os.environ['RUNNER_TEMP']) / 'frontend-deployment.json').read_text())
          assert deployment['projectId'] == os.environ['VERCEL_PROJECT_ID']
          assert deployment['target'] == 'production' and deployment['readyState'] == 'READY'
          assert deployment['meta']['githubCommitSha'] == os.environ['FRONTEND_SHA']
          assert deployment['meta']['readerControllerSha'] == os.environ['CONTROLLER_SHA']
          assert deployment['meta']['readerBackendSha'] == os.environ['BACKEND_SHA']
          print(json.dumps({'frontend_deployment': deployment['id'], 'source_sha': deployment['meta']['githubCommitSha'], 'status': 'PASS'}))
          PY

      - name: Promote retained production asset and run one focused smoke
        if: inputs.promotion_only == true
        run: python3 -m scripts.reader_existing_promotion --output "$RUNNER_TEMP/reader-existing-promotion.json"

      - name: Verify all four exact production alias bindings
        if: inputs.promotion_only != true
        id: alias-binding
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/verify_reader_alias_bindings.py" --conditional-promotion \
            --metadata "$RUNNER_TEMP/frontend-deployment.json" \
            --output "$RUNNER_TEMP/reader-alias-binding.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve exact production alias binding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-alias-binding-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reader-alias-binding.json
            ${{ runner.temp }}/reader-promotion-intent.json
            ${{ runner.temp }}/reader-existing-promotion.json
            ${{ runner.temp }}/reader-existing-smoke.json
            ${{ runner.temp }}/reader-rollback-intent.json
          retention-days: 3

  frontend_production_canary:
    name: Vercel frontend production canary
    needs:
      - backend_verify
      - deploy_frontend
    if: >-
      inputs.promotion_only != true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.backend_verify.result == 'success' &&
      needs.deploy_frontend.result == 'success' &&
      needs.deploy_frontend.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed canary controller
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CONTROLLER_SHA }}

      - name: Verify canary controller identity
        run: test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"

      - name: Run three-public one-protected alias contract
        env:
          VERIFIED_DEPLOYMENT_ID: ${{ needs.deploy_frontend.outputs.deployment_id }}
          VERIFIED_READY_AT: ${{ needs.deploy_frontend.outputs.ready_at }}
        run: |
          python3 scripts/reader_alias_canaries.py \
            --deployment "$VERIFIED_DEPLOYMENT_ID" --ready-at "$VERIFIED_READY_AT" \
            --contract three-public-one-protected-v1 --focused-smoke \
            --output output/launch/reader_alias_canaries.json

      - name: Upload frontend canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-production-canary-${{ env.FRONTEND_SHA }}-controller-${{ github.sha }}
          path: |
            output/launch/reader_alias_canaries.json
