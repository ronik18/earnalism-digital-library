name: Catalogue clearance evidence 20261002
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/legal/catalogue_clearance_20261002/**'
      - 'scripts/verify_catalogue_clearance_batch.py'
      - '.github/workflows/catalogue-clearance-20261002.yml'
permissions:
  contents: read
jobs:
  held-edition-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install existing validation dependencies
        run: |
          python -m pip install -r backend/requirements-runtime.txt
          python -m pip install beautifulsoup4 pytest
      - name: Validate immutable evidence and fail-closed preparation
        run: |
          python -m unittest scripts.test_reconcile_bengali_source_evidence scripts.test_reconcile_english_source_evidence -v
          python -m pytest backend/tests/test_licensed_text.py backend/tests/test_publication_manifest.py -q
          python scripts/verify_catalogue_clearance_batch.py
          git diff --check
