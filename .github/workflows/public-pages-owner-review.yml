name: Exact primary design owner review

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/src/components/ReferencePublicPages.*
      - frontend/src/pages/Home.*
      - frontend/src/pages/Library.*
      - frontend/src/pages/Pricing.*
      - frontend/src/pages/BookDetail.*
      - frontend/src/pages/Account.*
      - frontend/src/experiences-v2/**
      - frontend/src/styles/auth-account.css
      - frontend/src/components/Header.*
      - docs/design-references/**
      - docs/architecture/primary-visual-convergence.md
      - docs/architecture/primary-visual-owner-asset-gaps.*
      - scripts/capture_exact_primary_owner_review.mjs
      - scripts/test_capture_exact_primary_owner_review_mobile_menu.mjs
      - scripts/verify_exact_primary_cross_browser.mjs
      - scripts/generate_exact_primary_owner_review.py
      - uat/contracts/public-pages-visual-contract-v2.json
      - .github/workflows/public-pages-owner-review.yml

permissions:
  contents: read

jobs:
  owner-review:
    name: Owner-review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      REACT_APP_BACKEND_URL: http://127.0.0.1:18007/api
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          npm ci
          npm ci --prefix frontend --legacy-peer-deps
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify owner-scoped mobile-menu geometry
        run: |
          REACT_APP_ENABLE_VISUAL_FIXTURES=1 npm --prefix frontend run build
          node scripts/serve_frontend_build.js --port 13006 >"$RUNNER_TEMP/owner-review-mobile-menu-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13006/ >/dev/null && break; sleep 1; done
          UAT_BASE_URL=http://127.0.0.1:13006 MOBILE_MENU_GEOMETRY_RESULTS_OUTPUT=uat/evidence/exact-primary-design/current/focused-mobile-menu-results.json node scripts/test_capture_exact_primary_owner_review_mobile_menu.mjs

      - name: Materialize approved prior PR source without changing the pull request checkout
        env:
          PRIOR_REVIEWED_SHA: 230f04a2e33a5d8c01d84d5ad7694dfcf8dd7d2a
        run: |
          base_dir="$RUNNER_TEMP/earnalism-owner-review-base"
          mkdir -p "$base_dir"
          git cat-file -e "$PRIOR_REVIEWED_SHA^{commit}"
          git archive "$PRIOR_REVIEWED_SHA" | tar -x -C "$base_dir"
          mkdir -p "$base_dir/scripts"
          cp scripts/capture_exact_primary_owner_review.mjs "$base_dir/scripts/"
          cp scripts/serve_frontend_build.js "$base_dir/scripts/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base_dir/node_modules"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$base_dir/frontend/node_modules"

      - name: Capture approved prior PR public pages
        env:
          PRIOR_REVIEWED_SHA: 230f04a2e33a5d8c01d84d5ad7694dfcf8dd7d2a
        run: |
          base_dir="$RUNNER_TEMP/earnalism-owner-review-base"
          base_tree_sha="$(git rev-parse "$PRIOR_REVIEWED_SHA^{tree}")"
          (
            cd "$base_dir"
            REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" REACT_APP_ENABLE_VISUAL_FIXTURES=1 npm --prefix frontend run build
            node scripts/serve_frontend_build.js --port 13008 >"$RUNNER_TEMP/owner-review-base-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid"' EXIT
            for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13008/ >/dev/null && break; sleep 1; done
            PR_HEAD_SHA="$PRIOR_REVIEWED_SHA" ACTUAL_CHECKOUT_SHA="$PRIOR_REVIEWED_SHA" CHECKOUT_TREE_SHA="$base_tree_sha" UAT_BASE_URL=http://127.0.0.1:13008 OWNER_REVIEW_CAPTURE_STRICT=false EXACT_OWNER_REVIEW_CAPTURE_OUTPUT=uat/evidence/exact-primary-design/before node scripts/capture_exact_primary_owner_review.mjs
            body_sha="$({ rg --files frontend/src | rg '(^frontend/src/pages/(Home|Library|Pricing)\.jsx$|^frontend/src/components/Footer(\.jsx|SocialLinks\.jsx)$|^frontend/src/components/ReferencePublicPages\.(jsx|css)$|^frontend/src/design-system/.*\.css$)'; printf '%s\n' docs/product/public-cta-contract.json; } | sort | while IFS= read -r file; do sha256sum "$file"; done | sha256sum | awk '{print $1}')"
            header_sha="$(printf '%s\n' frontend/src/components/Header.jsx frontend/src/components/Header.css frontend/src/components/EarnalismBrandLockup.jsx frontend/src/components/EarnalismBrandLockup.css frontend/public/assets/brand/earnalism-brand-lockup.png | while IFS= read -r file; do sha256sum "$file"; done | sha256sum | awk '{print $1}')"
            printf '{"public_body_sha256":"%s","header_surface_sha256":"%s"}\n' "$body_sha" "$header_sha" > uat/evidence/exact-primary-design/before/surface-hashes.json
          )
          mkdir -p uat/evidence/exact-primary-design/before
          cp -R "$base_dir"/uat/evidence/exact-primary-design/before/. uat/evidence/exact-primary-design/before/

      - name: Capture current pull-request public pages
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_EVENT_SHA: ${{ github.sha }}
        run: |
          REACT_APP_ENABLE_VISUAL_FIXTURES=1 npm --prefix frontend run build
          node scripts/serve_frontend_build.js --port 13007 >"$RUNNER_TEMP/owner-review-head-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13007/ >/dev/null && break; sleep 1; done
          UAT_BASE_URL=http://127.0.0.1:13007 OWNER_REVIEW_CAPTURE_STRICT=true EXACT_OWNER_REVIEW_CAPTURE_OUTPUT=uat/evidence/exact-primary-design/current node scripts/capture_exact_primary_owner_review.mjs
          body_sha="$({ rg --files frontend/src | rg '(^frontend/src/pages/(Home|Library|Pricing)\.jsx$|^frontend/src/components/Footer(\.jsx|SocialLinks\.jsx)$|^frontend/src/components/ReferencePublicPages\.(jsx|css)$|^frontend/src/design-system/.*\.css$)'; printf '%s\n' docs/product/public-cta-contract.json; } | sort | while IFS= read -r file; do sha256sum "$file"; done | sha256sum | awk '{print $1}')"
          header_sha="$(printf '%s\n' frontend/src/components/Header.jsx frontend/src/components/Header.css frontend/src/components/EarnalismBrandLockup.jsx frontend/src/components/EarnalismBrandLockup.css frontend/public/assets/brand/earnalism-brand-lockup.png | while IFS= read -r file; do sha256sum "$file"; done | sha256sum | awk '{print $1}')"
          printf '{"public_body_sha256":"%s","header_surface_sha256":"%s"}\n' "$body_sha" "$header_sha" > uat/evidence/exact-primary-design/current/surface-hashes.json

      - name: Verify Firefox and WebKit public-route behavior
        run: |
          node scripts/serve_frontend_build.js --port 13007 >"$RUNNER_TEMP/owner-review-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13007/ >/dev/null && break; sleep 1; done
          for browser in firefox webkit; do
            UAT_BASE_URL=http://127.0.0.1:13007 EXACT_OWNER_REVIEW_BROWSER="$browser" EXACT_OWNER_REVIEW_BROWSER_OUTPUT="uat/evidence/exact-primary-design/current/browser-${browser}.json" node scripts/verify_exact_primary_cross_browser.mjs
          done

      - name: Generate labeled review package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/generate_exact_primary_owner_review.py

      - name: Upload owner-review artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr${{ github.event.pull_request.number }}-mobile-menu-viewport-fix-${{ github.event.pull_request.head.sha }}
          path: |
            uat/evidence/exact-primary-design/**
            uat/evidence/primary-visual-convergence/**
            docs/architecture/primary-visual-convergence.md
            docs/architecture/primary-visual-owner-asset-gaps.json
            docs/architecture/primary-visual-owner-asset-gaps.md
          if-no-files-found: error
