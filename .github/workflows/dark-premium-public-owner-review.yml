name: Dark premium public owner review

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/components/ReferencePublicPages.*
      - frontend/src/components/Footer.jsx
      - frontend/src/design-system/**
      - frontend/src/data/publicEvidenceSnapshot.json
      - frontend/src/lib/darkPremiumPublicSystem.test.js
      - docs/product/public-cta-contract.json
      - scripts/capture_dark_premium_public_review.mjs
      - scripts/generate_dark_premium_public_owner_review.py
      - .github/workflows/dark-premium-public-owner-review.yml

permissions:
  contents: read

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REACT_APP_BACKEND_URL: http://127.0.0.1:18007/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          npm ci --prefix frontend --legacy-peer-deps
          python3 -m pip install --disable-pip-version-check pillow
          npx playwright install --with-deps chromium firefox webkit
      - run: npm --prefix frontend run build
      - run: |
          node scripts/serve_frontend_build.js --port 13007 > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13007/ >/dev/null && break; sleep 1; done
          for browser in chromium firefox webkit; do
            UAT_BASE_URL=http://127.0.0.1:13007 DARK_PREMIUM_CAPTURE_OUTPUT=uat/evidence/dark-premium-public-v1/current DARK_PREMIUM_BROWSER=$browser node scripts/capture_dark_premium_public_review.mjs
          done
          python3 scripts/generate_dark_premium_public_owner_review.py --current uat/evidence/dark-premium-public-v1/current --output uat/evidence/dark-premium-public-v1-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: dark-premium-public-v1-${{ github.event.pull_request.head.sha }}
          path: uat/evidence/dark-premium-public-v1-*/**
          if-no-files-found: error
