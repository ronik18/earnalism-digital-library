name: GO LIVE regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_only:
        description: Run only the separately approved no-deploy Linux frontend qualification
        required: false
        default: false
        type: boolean
      target_sha:
        description: Exact controller SHA; feature head for build_only, current main otherwise
        required: true
        type: string
      confirm_production:
        description: BUILD_AND_PACKAGE_ONLY for build_only; DEPLOY_PRODUCTION otherwise
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && format('frontend-build-only-{0}', github.run_id) || format('go-live-regression-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}

jobs:
  regression:
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only
    name: regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: ci
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify manual release authorization and clean source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "${CONFIRM_PRODUCTION}" == 'DEPLOY_PRODUCTION' ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" == "${GITHUB_SHA}" ]] || exit 1
          git fetch origin main
          [[ "${TARGET_SHA}" == "$(git rev-parse origin/main)" ]] || exit 1
          git cat-file -e "${TARGET_SHA}^{commit}"
          [[ "$(git rev-parse HEAD)" == "${TARGET_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          echo "RELEASE_SOURCE_SHA=${TARGET_SHA}"
          echo 'RELEASE_SOURCE_CLEAN=YES'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Set up Python for isolated UAT
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install launcher test prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate catalogue worker permission boundaries
        run: python3 -m unittest scripts.test_reader_benchmark_runner scripts.test_catalogue_compliance_workflow_cost scripts.test_catalogue_compliance_worker_permissions scripts.test_catalogue_compliance_worker_receipt scripts.test_catalogue_compliance_generated_evidence scripts.test_catalogue_compliance_batch scripts.test_catalogue_compliance_controller_evidence -v

      - name: Validate historical unavailable snapshots and raw HTML canary
        run: python3 -m unittest scripts.test_post_deploy_static_seo_canary scripts.test_manual_production_release_workflow scripts.test_verify_isolated_seo_build scripts.test_frontend_build_qualification scripts.test_complete_release_capture scripts.test_verify_backend_release scripts.test_reader_startup_readonly -v

      - name: Validate additive health attestation in isolated ASGI
        run: |
          python3 -m pip install pytest fastapi==0.110.1 httpx==0.28.1
          python3 -m pytest backend/tests/test_deployment_attestation.py -q

      - name: Run complete local UAT launcher suite
        run: |
          command -v bash node python3 rg shasum
          bash --version
          node --version
          python3 --version
          rg --version
          shasum --version
          env -u REACT_APP_BACKEND_URL -u REACT_APP_API_URL -u SEO_API_BASE_URL \
            bash scripts/test_local_uat_launcher.sh

      - name: Run UAT report-preservation tests
        run: |
          python3 -m unittest scripts/test_generate_system_uat_report.py
          bash scripts/test_system_uat_failure_propagation.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name earnalism-uat-mongodb --network host mongo:7.0.14 mongod --bind_ip 127.0.0.1 --port 27018 --replSet earnalism-uat-rs0
          for _ in $(seq 1 30); do
            docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'db.adminCommand({ ping: 1 })' && break
            sleep 1
          done
          docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'try { rs.initiate({_id: "earnalism-uat-rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }]}) } catch (error) { if (error.codeName !== "AlreadyInitialized") throw error }'

      - name: Start isolated Redis
        run: docker run --detach --name earnalism-uat-redis --network host redis:8.2.1 redis-server --bind 127.0.0.1 --port 26379 --save '' --appendonly no

      - name: Run isolated current-commit pre-deploy regression
        env:
          UAT_EXTERNAL_MONGODB: true
          UAT_EXTERNAL_REDIS: true
          NODE_ENV: production
        run: bash scripts/run_pr_regression.sh

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm --force earnalism-uat-mongodb earnalism-uat-redis

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-artifacts
          path: |
            regression/results.json
            regression/artifacts/**

      - name: PR summary comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('regression/results.json', 'utf8'));
            const report = raw.regression || raw;
            const body = [
              '### Regression module scores',
              '',
              ...report.modules.map((m) => `- ${m.score === 100 ? 'PASS' : 'FAIL'} ${m.score}: ${m.moduleName}`),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  frontend_build_only:
    name: Linux frontend build and packaging only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_only == true &&
      github.repository == 'ronik18/earnalism-digital-library' &&
      github.ref == 'refs/heads/codex/reader-only-strict-fit-20261017' &&
      inputs.target_sha == github.sha &&
      inputs.confirm_production == 'BUILD_AND_PACKAGE_ONLY'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONTROLLER_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout exact approved controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, retained resolved revision
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use reviewed Node and npm runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.2'

      - name: Use Python for local verifiers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run credential-free local build qualification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/codex/reader-only-strict-fit-20261017' ]] || exit 1
          [[ "$CONTROLLER_SHA" == "$GITHUB_SHA" ]] || exit 1
          python3 -m scripts.qualify_frontend_build_only --controller-sha "$CONTROLLER_SHA" --output-root "$RUNNER_TEMP/frontend-build-only-$GITHUB_RUN_ID"

      - name: Record explicit incomplete-capture marker if needed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / ('frontend-build-only-' + os.environ['GITHUB_RUN_ID']) / 'upload'
          out.mkdir(parents=True, exist_ok=True)
          if not (out / 'release-candidate.zip').exists() and not (out / 'CAPTURE-FAILURE.json').exists():
              (out / 'CAPTURE-FAILURE.json').write_text(json.dumps({'status':'HOLD_CAPTURE_NOT_COMPLETED','no_automatic_retry':True}))
          PY

      - name: Retain complete bounded public capture or explicit failure marker
        if: always()
        id: capture_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-build-only-${{ github.run_id }}/upload/
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Verify actual hosted artifact size
        if: steps.capture_upload.outputs.artifact-id != ''
        env:
          CAPTURE_ARTIFACT_ID: ${{ steps.capture_upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          artifact_id = os.environ['CAPTURE_ARTIFACT_ID']
          assert artifact_id.isdecimal()
          url = 'https://api.github.com/repos/ronik18/earnalism-digital-library/actions/artifacts/' + artifact_id
          with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept':'application/vnd.github+json'}), timeout=20) as response:
              metadata = json.load(response)
          assert metadata['size_in_bytes'] <= 64 * 1024 * 1024
          print(json.dumps({'artifact_id':artifact_id,'actual_compressed_bytes':metadata['size_in_bytes'],'status':'PASS_SIZE_ONLY_PENDING_IMMEDIATE_INDEPENDENT_DOWNLOAD'}))
          PY
