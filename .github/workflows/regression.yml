name: GO LIVE regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main commit to release
        required: true
        type: string
      confirm_production:
        description: Type DEPLOY_PRODUCTION to authorize production
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: go-live-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: ci
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify manual release authorization and clean source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "${CONFIRM_PRODUCTION}" == 'DEPLOY_PRODUCTION' ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" == "${GITHUB_SHA}" ]] || exit 1
          git fetch origin main
          [[ "${TARGET_SHA}" == "$(git rev-parse origin/main)" ]] || exit 1
          git cat-file -e "${TARGET_SHA}^{commit}"
          [[ "$(git rev-parse HEAD)" == "${TARGET_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          echo "RELEASE_SOURCE_SHA=${TARGET_SHA}"
          echo 'RELEASE_SOURCE_CLEAN=YES'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Set up Python for isolated UAT
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install launcher test prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate catalogue worker permission boundaries
        run: python3 -m unittest scripts.test_reader_benchmark_runner scripts.test_catalogue_compliance_workflow_cost scripts.test_catalogue_compliance_worker_permissions scripts.test_catalogue_compliance_worker_receipt scripts.test_catalogue_compliance_generated_evidence scripts.test_catalogue_compliance_batch scripts.test_catalogue_compliance_controller_evidence -v

      - name: Validate historical unavailable snapshots and raw HTML canary
        run: python3 -m unittest scripts.test_post_deploy_static_seo_canary scripts.test_manual_production_release_workflow -v

      - name: Run complete local UAT launcher suite
        run: |
          command -v bash node python3 rg shasum
          bash --version
          node --version
          python3 --version
          rg --version
          shasum --version
          env -u REACT_APP_BACKEND_URL -u REACT_APP_API_URL -u SEO_API_BASE_URL \
            bash scripts/test_local_uat_launcher.sh

      - name: Run UAT report-preservation tests
        run: |
          python3 -m unittest scripts/test_generate_system_uat_report.py
          bash scripts/test_system_uat_failure_propagation.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name earnalism-uat-mongodb --network host mongo:7.0.14 mongod --bind_ip 127.0.0.1 --port 27018 --replSet earnalism-uat-rs0
          for _ in $(seq 1 30); do
            docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'db.adminCommand({ ping: 1 })' && break
            sleep 1
          done
          docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'try { rs.initiate({_id: "earnalism-uat-rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }]}) } catch (error) { if (error.codeName !== "AlreadyInitialized") throw error }'

      - name: Start isolated Redis
        run: docker run --detach --name earnalism-uat-redis --network host redis:8.2.1 redis-server --bind 127.0.0.1 --port 26379 --save '' --appendonly no

      - name: Run isolated current-commit pre-deploy regression
        env:
          UAT_EXTERNAL_MONGODB: true
          UAT_EXTERNAL_REDIS: true
          NODE_ENV: production
        run: bash scripts/run_pr_regression.sh

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm --force earnalism-uat-mongodb earnalism-uat-redis

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-artifacts
          path: |
            regression/results.json
            regression/artifacts/**

      - name: PR summary comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('regression/results.json', 'utf8'));
            const report = raw.regression || raw;
            const body = [
              '### Regression module scores',
              '',
              ...report.modules.map((m) => `- ${m.score === 100 ? 'PASS' : 'FAIL'} ${m.score}: ${m.moduleName}`),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  deploy_frontend:
    name: Vercel frontend deploy after pre-deploy pass
    needs: regression
    # Configure required reviewers before merge. Release this hold only after
    # the same main revision is serving on Railway and backend verification passes.
    environment: reader-frontend-production
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.vercel-check.outputs.enabled }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE || vars.VERCEL_SCOPE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Recheck exact main and clean deployment source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_PRODUCTION}" == 'DEPLOY_PRODUCTION' ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" == "${GITHUB_SHA}" ]] || exit 1
          git fetch origin main
          [[ "${TARGET_SHA}" == "$(git rev-parse origin/main)" ]] || exit 1
          git cat-file -e "${TARGET_SHA}^{commit}"
          [[ "$(git rev-parse HEAD)" == "${TARGET_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          echo "BUILD_SHA=${TARGET_SHA}"
          echo 'BUILD_SOURCE_CLEAN=YES'

      - name: Check Vercel deploy scope and secrets
        id: vercel-check
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [[ "${RELEASE_EVENT}" == 'workflow_dispatch' ]]; then
            [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]] || { echo 'Required production deployment credentials unavailable' >&2; exit 1; }
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          before_sha="${{ github.event.before }}"
          if [[ ! "${before_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ "${before_sha}" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}"; then
            before_sha="$(git rev-list --max-parents=0 "${GITHUB_SHA}" | tail -1)"
          fi
          echo "scope_base=${before_sha}"
          echo "scope_head=${GITHUB_SHA}"
          if git diff --quiet "${before_sha}" "${GITHUB_SHA}" -- frontend .vercelignore scripts/verify_vercel_packaging.py; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Vercel frontend deploy skipped: no frontend or packaging files changed."
          elif [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Vercel frontend deploy skipped: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing."
          fi

      - name: Set up Node
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.enabled == 'true'
        run: npm install -g vercel@latest

      - name: Link Vercel project
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p .vercel
          node - <<'NODE'
          const fs = require('fs');

          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }, null, 2)}\n`,
          );
          NODE

      - name: Pull Vercel production environment
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          args=(pull --yes --environment=production --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

      - name: Build frontend for Vercel
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
            [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
            echo "BUILD_SHA=${GITHUB_SHA}"
            echo 'BUILD_SOURCE_CLEAN=YES'
          fi
          rm -rf .vercel/output
          args=(build --prod --yes --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

      - name: Verify source and prebuilt function packaging
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 -m unittest scripts.test_verify_vercel_packaging -v
          vercel deploy --dry --format=json --token "${VERCEL_TOKEN}" > /tmp/vercel-source-manifest.json
          python3 scripts/verify_vercel_packaging.py --manifest /tmp/vercel-source-manifest.json --output /tmp/vercel-source-packaging.json
          vercel deploy --prebuilt --prod --dry --format=json --token "${VERCEL_TOKEN}" > /tmp/vercel-prebuilt-manifest.json
          python3 scripts/verify_vercel_packaging.py --manifest /tmp/vercel-prebuilt-manifest.json --prebuilt --compare /tmp/vercel-source-packaging.json --output /tmp/vercel-prebuilt-packaging.json

      - name: Publish function packaging evidence
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-function-packaging-${{ github.sha }}
          path: |
            /tmp/vercel-source-packaging.json
            /tmp/vercel-prebuilt-packaging.json

      - name: Deploy frontend to Vercel production
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          args=(deploy --prebuilt --prod --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

  frontend_production_canary:
    name: Vercel frontend production canary
    needs:
      - regression
      - deploy_frontend
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success' &&
      needs.deploy_frontend.result == 'success' &&
      needs.deploy_frontend.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed frontend commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install canary dependencies
        run: npm ci

      - name: Run removed-route production canary
        run: python3 scripts/post_deploy_route_canary.py --base-url https://theearnalism.com

      - name: Run static SEO raw-HTML canary
        run: python3 scripts/post_deploy_static_seo_canary.py --base-url https://theearnalism.com

      - name: Run frontend production regression canary
        env:
          REGRESSION_MODE: canary
          REGRESSION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://theearnalism.com' }}
          REGRESSION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.theearnalism.com' }}
        run: node regression/scripts/post-deploy-canary.js

      - name: Upload frontend canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-production-canary-${{ github.sha }}
          path: |
            output/launch/post_deploy_route_canary.*
            output/launch/post_deploy_static_seo_canary.*
            regression/results.json
