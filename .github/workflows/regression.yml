name: GO LIVE regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_only:
        description: Run only the separately approved no-deploy Linux frontend qualification
        required: false
        default: false
        type: boolean
      target_sha:
        description: Exact controller SHA; feature head for build_only, current main otherwise
        required: true
        type: string
      confirm_production:
        description: BUILD_AND_PACKAGE_ONLY for build_only; DEPLOY_PRODUCTION otherwise
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && format('frontend-build-only-{0}', github.run_id) || format('go-live-regression-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}

jobs:
  regression:
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only
    name: regression gate
    # Pin the supported OS for the existing Playwright 1.60 browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_ENV: ci
      # Immutable regression case, never the current candidate's recovery proof.
      HISTORICAL_PAIR_CONTROLLER_SHA: babb32bb6be02caafb996d090d6ce95586c2d985
      HISTORICAL_PAIR_CONTROLLER_TREE: 9a09e62f58f06eb8ac516dd5671817b31e8cf136
      HISTORICAL_PAIR_BOOTSTRAP_SHA: 65ca071ebebba3edb73ab44fd13c7e00f95b54e6
      HISTORICAL_PAIR_APPLICATION_SHA: fe38e8a82844bf0b1682aede0a4bf550e5fe1ec2
      # Retained current A/B controller; never recovery qualification of CI HEAD.
      RETAINED_PAIR_CONTROLLER_SHA: e547d0163fa8d1f59891724e2717fb1526fd4ed6
      RETAINED_PAIR_CONTROLLER_TREE: 347a5952c2869ad9aa743a967aef2e5702c93586
      # Avoid retaining a second wheel/download copy beside the isolated UAT environment.
      PIP_NO_CACHE_DIR: "1"
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify manual release authorization and clean source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "${CONFIRM_PRODUCTION}" == 'DEPLOY_PRODUCTION' ]] || exit 1
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${TARGET_SHA}" == "${GITHUB_SHA}" ]] || exit 1
          git fetch origin main
          [[ "${TARGET_SHA}" == "$(git rev-parse origin/main)" ]] || exit 1
          git cat-file -e "${TARGET_SHA}^{commit}"
          [[ "$(git rev-parse HEAD)" == "${TARGET_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          echo "RELEASE_SOURCE_SHA=${TARGET_SHA}"
          echo 'RELEASE_SOURCE_CLEAN=YES'

      - name: Fetch bounded reviewed catalogue history
        # Hydrate only immutable trees and the exact blobs consumed by CI.
        timeout-minutes: 4
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          # Ordinary source CI hydrates historical roles; only manual release
          # may claim its candidate backend is that exact recovery application.
          PAIR_SOURCE_ONLY: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Filtered fetch persists remote settings; restore the exact prior state.
          had_promisor=0
          had_filter=0
          prior_promisor="$(git config --local --get remote.origin.promisor)" && had_promisor=1 || true
          prior_filter="$(git config --local --get remote.origin.partialclonefilter)" && had_filter=1 || true
          restore_fetch_config() {
            if (( had_promisor )); then
              git config --local remote.origin.promisor "$prior_promisor"
            else
              git config --local --unset-all remote.origin.promisor || [[ $? == 5 ]]
            fi
            if (( had_filter )); then
              git config --local remote.origin.partialclonefilter "$prior_filter"
            else
              git config --local --unset-all remote.origin.partialclonefilter || [[ $? == 5 ]]
            fi
          }
          trap restore_fetch_config EXIT
          bindings=()
          pair_bootstrap_pin=''
          for source_pin in \
            b4bc7585a87b7546db3270f3bfd63bd436e8585a \
            f5706d328e08ab330f65f604f51df322b65646f1 \
            c980ff2da048db7a164648f06f707440b2a8124c \
            15b157e5555b67ede6fd649fb9057d314c36bf3c \
            2f3615a1213aa60e30e8a24593cf874adcc454c3; do
            bindings+=("$source_pin:backend/data/rights_decision_registry.json")
            bindings+=("$source_pin:internal/legal/catalogue_clearance_20261002/reviewed_release_authority_20261003.v1.json")
          done
          if [[ -f internal/legal/purchase_guard_source.json ]]; then
            source_pin="$(jq -er '.approved_merged_584_sha' internal/legal/purchase_guard_source.json)"
            [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            bindings+=("$source_pin:backend/server.py")
            guard_schema="$(jq -er '.schema' internal/legal/purchase_guard_source.json)"
            if [[ "$guard_schema" == 'earnalism.purchase-guard-source.v2' || "$guard_schema" == 'earnalism.purchase-guard-source.v3' ]]; then
              application_pin="$(jq -er '.application_source_sha' internal/legal/purchase_guard_source.json)"
              [[ "$application_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
              bindings+=("$application_pin:backend/server.py")
            fi
            if [[ "$guard_schema" == 'earnalism.purchase-guard-source.v3' ]]; then
              pair_bootstrap_pin="$(jq -er '.guarded_bootstrap_source_sha' internal/legal/purchase_guard_source.json)"
              [[ "$pair_bootstrap_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
              bindings+=("$pair_bootstrap_pin:internal/legal/purchase_guard_source.json")
            fi
          fi
          if [[ -f internal/legal/purchase_protocol_application_source.json ]]; then
            source_pin="$(jq -er '.application_source_sha' internal/legal/purchase_protocol_application_source.json)"
            [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            bindings+=("$source_pin:backend/server.py")
          fi
          # BEGIN archived application bindings
          # Preserve exact old application bodies consumed by historical negatives.
          for archived_contract in \
            internal/legal/history/pr656-source-only-0d3a5d58/purchase_guard_source.json \
            internal/legal/history/pr656-source-only-0d3a5d58/purchase_protocol_application_source.json; do
            if [[ -f "$archived_contract" ]]; then
              source_pin="$(jq -er '.application_source_sha' "$archived_contract")"
              [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
              bindings+=("$source_pin:backend/server.py")
              if [[ "$archived_contract" == */purchase_guard_source.json ]]; then
                source_pin="$(jq -er '.guarded_bootstrap_source_sha' "$archived_contract")"
                [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
                bindings+=("$source_pin:backend/server.py")
              fi
            fi
          done
          # END archived application bindings
          if [[ -f scripts/build_india_guarded_rollback.py ]]; then
            bindings+=("4dc9e8fd3f9eafd28445b408d376b73634ccfa56:backend/server.py")
          fi
          reader_source_pin=''
          reader_binding=internal/release/reader612_native_preparation.json
          if [[ -f "$reader_binding" ]]; then
            for field in source_sha application_base prior_reader_source; do
              source_pin="$(jq -er ".$field" "$reader_binding")"
              [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
              source_path=backend/server.py
              if [[ "$field" == prior_reader_source ]]; then source_path=backend/reading_pass_service.py; fi
              bindings+=("$source_pin:$source_path")
            done
            reader_source_pin="$(jq -er '.source_sha' "$reader_binding")"
            application_pin="$(jq -er '.application_base' "$reader_binding")"
            bindings+=("$application_pin:backend/.runtime-source-manifest.json")
          fi
          # Positive historical native-consumer tests read immutable retained blobs,
          # never the newly changed application checkout. Hydrate the exact closure
          # in this same bounded batch; do not add lazy fetches or retries in tests.
          consumer_contract=internal/earnalism_intelligence/listener_text_sync_consumer.json
          [[ "$(sha256sum "$consumer_contract" | awk '{print $1}')" == '6f1ebb978201f85fbaf1675a567000db074412ab2066ca15ff3481771c02ff18' ]] || exit 1
          [[ "$RETAINED_PAIR_CONTROLLER_SHA" == 'e547d0163fa8d1f59891724e2717fb1526fd4ed6' ]] || exit 1
          [[ "$(jq -er '.sources | length' "$consumer_contract")" == 12 ]] || exit 1
          bindings+=("$RETAINED_PAIR_CONTROLLER_SHA:$consumer_contract")
          bindings+=("$RETAINED_PAIR_CONTROLLER_SHA:internal/legal/sredni_reader_retirement_owner_instruction.json")
          bindings+=("$RETAINED_PAIR_CONTROLLER_SHA:internal/legal/sredni_native_build_amendment_owner_acceptance.json")
          while IFS= read -r source_path; do
            bindings+=("$RETAINED_PAIR_CONTROLLER_SHA:$source_path")
          done < <(jq -er '.sources | keys[]' "$consumer_contract")
          missing_commits=()
          for binding in "${bindings[@]}"; do
            if ! git -c remote.origin.promisor=false cat-file -e "$binding" 2>/dev/null; then
              missing_commits+=("${binding%%:*}")
            fi
          done
          if (( ${#missing_commits[@]} )); then
            unique=()
            while IFS= read -r object_id; do unique+=("$object_id"); done < <(printf '%s\n' "${missing_commits[@]}" | sort -u)
            missing_commits=("${unique[@]}")
            git -c gc.auto=0 fetch --filter=blob:none --no-tags --depth=1 origin "${missing_commits[@]}"
          fi
          # BEGIN bounded current guarded source pair admission
          [[ "${PAIR_SOURCE_ONLY:-false}" == true || "${PAIR_SOURCE_ONLY:-false}" == false ]] || exit 1
          if [[ -n "$pair_bootstrap_pin" ]]; then
            [[ "$pair_bootstrap_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            pair_controller_pin="$(git rev-parse HEAD)"
            [[ "$pair_controller_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if [[ "${PAIR_SOURCE_ONLY:-false}" == true ]]; then
              [[ "$HISTORICAL_PAIR_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ && "$HISTORICAL_PAIR_CONTROLLER_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
              [[ "$HISTORICAL_PAIR_BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
              # Fetch this exact historical tree first. HEAD's bounded commit
              # admission below then restores ancestry past its shallow edge.
              git -c gc.auto=0 fetch --refetch --filter=blob:none --no-tags --depth=1 origin "$HISTORICAL_PAIR_CONTROLLER_SHA"
              [[ "$HISTORICAL_PAIR_APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
              git -c gc.auto=0 fetch --filter=blob:none --no-tags --depth=1 origin "$HISTORICAL_PAIR_APPLICATION_SHA"
              bindings+=("$HISTORICAL_PAIR_APPLICATION_SHA:backend/server.py")
            fi
            # Finite descendant metadata for the retained A/B role history, not
            # authority. Only commits for HEAD ancestry; no trees or file blobs.
            git -c gc.auto=0 fetch --filter=tree:0 --no-tags --depth=64 origin "$pair_controller_pin"
            if [[ "${PAIR_SOURCE_ONLY:-false}" == true && "$pair_bootstrap_pin" != "$HISTORICAL_PAIR_BOOTSTRAP_SHA" ]]; then
              # HEAD may contain a reviewed successor application. Admit retained
              # A/B at its immutable controller, with unchanged approval custody.
              [[ "$RETAINED_PAIR_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ && "$RETAINED_PAIR_CONTROLLER_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
              git -c gc.auto=0 fetch --refetch --filter=blob:none --no-tags --depth=1 origin "$RETAINED_PAIR_CONTROLLER_SHA"
              # Restore bounded ancestry after the exact-tree fetch introduces a shallow edge.
              git -c gc.auto=0 fetch --filter=tree:0 --no-tags --depth=64 origin "$pair_controller_pin"
              git -c remote.origin.promisor=false merge-base --is-ancestor "$RETAINED_PAIR_CONTROLLER_SHA" HEAD
              [[ "$(git rev-parse "$RETAINED_PAIR_CONTROLLER_SHA^{tree}")" == "$RETAINED_PAIR_CONTROLLER_TREE" ]] || exit 1
              for custody_path in internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json; do
                [[ "$(git rev-parse "$RETAINED_PAIR_CONTROLLER_SHA:$custody_path")" == "$(git rev-parse "HEAD:$custody_path")" ]] || exit 1
              done
              pair_controller_pin="$RETAINED_PAIR_CONTROLLER_SHA"
            fi
            # Re-admit B/A with their trees: tree:0 may already have their commit
            # IDs, so normal negotiation could otherwise skip promised trees.
            git -c gc.auto=0 fetch --refetch --filter=blob:none --no-tags --depth=2 origin "$pair_bootstrap_pin"
            git -c remote.origin.promisor=false merge-base --is-ancestor "$pair_bootstrap_pin" "$pair_controller_pin"
            read -r pair_actual_pin pair_parent_pin pair_extra_parent <<< "$(git -c remote.origin.promisor=false rev-list --parents -n 1 "$pair_bootstrap_pin")"
            [[ "$pair_actual_pin" == "$pair_bootstrap_pin" && "$pair_parent_pin" =~ ^[0-9a-f]{40}$ && -z "$pair_extra_parent" ]] || exit 1
            for pair_pin in "$pair_bootstrap_pin" "$pair_parent_pin"; do
              git -c remote.origin.promisor=false cat-file -e "$pair_pin^{commit}"
              [[ "$(git -c remote.origin.promisor=false cat-file -t "$pair_pin:backend")" == tree ]]
            done
            # Metadata checks precede historical body hydration. No unrelated
            # snapshot/file may enter the two explicitly bound backend roles.
            pair_changed="$(git -c remote.origin.promisor=false diff-tree --no-commit-id --name-only -r "$pair_parent_pin" "$pair_bootstrap_pin" | LC_ALL=C sort)"
            [[ "$pair_changed" == $'backend/.runtime-source-manifest.json\nbackend/server.py\ninternal/legal/purchase_guard_source.json' ]] || exit 1
            if [[ "${PAIR_SOURCE_ONLY:-false}" == false || "$pair_bootstrap_pin" != "$HISTORICAL_PAIR_BOOTSTRAP_SHA" ]]; then
              [[ "$(git rev-parse "$pair_controller_pin:backend")" == "$(git rev-parse "$pair_parent_pin:backend")" ]] || exit 1
            elif [[ "${PAIR_SOURCE_ONLY:-false}" == true ]]; then
              # Do not mislabel historical A/B hydration as qualification of a
              # newer backend. Runtime recovery/controller gates remain separate.
              git -c remote.origin.promisor=false merge-base --is-ancestor "$pair_bootstrap_pin" "$HISTORICAL_PAIR_CONTROLLER_SHA"
              git -c remote.origin.promisor=false merge-base --is-ancestor "$HISTORICAL_PAIR_CONTROLLER_SHA" "$pair_controller_pin"
              [[ "$(git rev-parse "$HISTORICAL_PAIR_CONTROLLER_SHA^{tree}")" == "$HISTORICAL_PAIR_CONTROLLER_TREE" ]] || exit 1
              [[ "$(git rev-parse "$HISTORICAL_PAIR_CONTROLLER_SHA:backend")" == "$(git rev-parse "$pair_parent_pin:backend")" ]] || exit 1
              [[ "$(git rev-parse "$HISTORICAL_PAIR_CONTROLLER_SHA:internal/legal/purchase_guard_source.json")" == "$(git rev-parse HEAD:internal/legal/purchase_guard_source.json)" ]] || exit 1
              while IFS= read -r -d '' source_path; do
                bindings+=("$HISTORICAL_PAIR_CONTROLLER_SHA:$source_path")
              done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$HISTORICAL_PAIR_CONTROLLER_SHA" -- backend scripts/build_runtime_source_manifest.py internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json .gitignore .gitattributes)
              echo 'HISTORICAL_PAIR_ONLY_NOT_CURRENT_BACKEND_RECOVERY_QUALIFICATION'
            else
              exit 1
            fi
            for pair_pin in "$pair_bootstrap_pin" "$pair_parent_pin"; do
              while IFS= read -r -d '' source_path; do
                bindings+=("$pair_pin:$source_path")
              done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$pair_pin" -- backend .gitignore internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json)
            done
          fi
          # A current pair can differ from the immutable C/B65 helper baseline.
          # Admit that historical pair independently, with no HEAD relabelling.
          if [[ "${PAIR_SOURCE_ONLY:-false}" == true && -n "$pair_bootstrap_pin" && "$pair_bootstrap_pin" != "$HISTORICAL_PAIR_BOOTSTRAP_SHA" ]]; then
            historical_bootstrap_pin="$HISTORICAL_PAIR_BOOTSTRAP_SHA"
            git -c gc.auto=0 fetch --refetch --filter=blob:none --no-tags --depth=2 origin "$historical_bootstrap_pin"
            # Both depth-2 role fetches introduce parent shallow edges. Restore
            # only bounded HEAD ancestry before checking historical lineage.
            git -c gc.auto=0 fetch --filter=tree:0 --no-tags --depth=64 origin "$pair_controller_pin"
            git -c remote.origin.promisor=false merge-base --is-ancestor "$historical_bootstrap_pin" "$HISTORICAL_PAIR_CONTROLLER_SHA"
            git -c remote.origin.promisor=false merge-base --is-ancestor "$HISTORICAL_PAIR_CONTROLLER_SHA" "$pair_controller_pin"
            [[ "$(git rev-parse "$HISTORICAL_PAIR_CONTROLLER_SHA^{tree}")" == "$HISTORICAL_PAIR_CONTROLLER_TREE" ]] || exit 1
            read -r historical_actual_pin historical_parent_pin historical_extra_parent <<< "$(git -c remote.origin.promisor=false rev-list --parents -n 1 "$historical_bootstrap_pin")"
            [[ "$historical_actual_pin" == "$historical_bootstrap_pin" && "$historical_parent_pin" =~ ^[0-9a-f]{40}$ && -z "$historical_extra_parent" ]] || exit 1
            [[ "$(git rev-parse "$HISTORICAL_PAIR_CONTROLLER_SHA:backend")" == "$(git rev-parse "$historical_parent_pin:backend")" ]] || exit 1
            historical_changed="$(git -c remote.origin.promisor=false diff-tree --no-commit-id --name-only -r "$historical_parent_pin" "$historical_bootstrap_pin" | LC_ALL=C sort)"
            [[ "$historical_changed" == $'backend/.runtime-source-manifest.json\nbackend/server.py\ninternal/legal/purchase_guard_source.json' ]] || exit 1
            for historical_pin in "$HISTORICAL_PAIR_CONTROLLER_SHA" "$historical_bootstrap_pin" "$historical_parent_pin"; do
              while IFS= read -r -d '' source_path; do
                bindings+=("$historical_pin:$source_path")
              done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$historical_pin" -- backend scripts/build_runtime_source_manifest.py internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json .gitignore .gitattributes)
            done
            echo 'CURRENT_PAIR_SOURCE_AND_SEPARATE_HISTORICAL_HELPER_NOT_NATIVE_QUALIFICATION'
          fi
          if [[ "${PAIR_SOURCE_ONLY:-false}" == true && -n "$pair_bootstrap_pin" && "$pair_bootstrap_pin" != "$HISTORICAL_PAIR_BOOTSTRAP_SHA" ]]; then
            while IFS= read -r -d '' source_path; do
              bindings+=("$RETAINED_PAIR_CONTROLLER_SHA:$source_path")
            done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$RETAINED_PAIR_CONTROLLER_SHA" -- backend scripts/build_runtime_source_manifest.py internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json .gitignore .gitattributes)
            echo 'RETAINED_PAIR_ONLY_NOT_CURRENT_CANDIDATE_RECOVERY_QUALIFICATION'
          fi
          # END bounded current guarded source pair admission
          if [[ -n "$reader_source_pin" ]]; then
            # Keep every recovery backend byte and its exact legal/ignore inputs.
            while IFS= read -r -d '' source_path; do
              bindings+=("$reader_source_pin:$source_path")
            done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$reader_source_pin" -- backend .gitignore .gitattributes internal/legal/purchase_guard_source.json internal/legal/purchase_guard_owner_acceptance.json internal/legal/reader612_recovery_source.json)
          fi
          # Exact manuscripts/removal inventory consumed by the 45-title successor tests.
          reader45_pin=2f3615a1213aa60e30e8a24593cf874adcc454c3
          reader45_receipt=internal/legal/catalogue_clearance_20261002/persisted45_reader_20261108/successor.json
          removed_manifest=internal/legal/catalogue_clearance_20261002/removed_titles_20261110/removal-manifest.json
          if [[ -f "$reader45_receipt" ]]; then
            [[ "$(jq -er .parent_source_head "$reader45_receipt")" == "$reader45_pin" ]] || exit 1
            while IFS= read -r source_path; do bindings+=("$reader45_pin:$source_path"); done < <(jq -r '.preserved_predecessor_files | keys[]' "$reader45_receipt")
            while IFS= read -r slug; do
              [[ "$slug" =~ ^[a-z0-9-]+$ ]] || exit 1
              while IFS= read -r -d '' source_path; do bindings+=("$reader45_pin:$source_path"); done < <(git -c remote.origin.promisor=false ls-tree -rz --name-only "$reader45_pin" -- "data/controlled_publications/$slug/chapters" "data/controlled_publications/$slug/rights_decision.json")
            done < <(jq -r '.slugs[]' "$reader45_receipt")
          fi
          if [[ -f "$removed_manifest" ]]; then
            [[ "$(jq -er .source_sha "$removed_manifest")" == "$reader45_pin" ]] || exit 1
            while IFS= read -r source_path; do bindings+=("$reader45_pin:$source_path"); done < <(jq -r '.source_files[].path' "$removed_manifest")
          fi
          printf 'RETAINED_HYDRATION_DISCOVERY_START bindings=%s\n' "${#bindings[@]}"
          missing_blobs=()
          for binding in "${bindings[@]}"; do
            object_id="$(git rev-parse --verify "$binding")"
            [[ "$object_id" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if ! git -c remote.origin.promisor=false cat-file -e "$object_id" 2>/dev/null; then
              missing_blobs+=("$object_id")
            fi
          done
          printf 'RETAINED_HYDRATION_DISCOVERY_COMPLETE missing_entries=%s\n' "${#missing_blobs[@]}"
          if (( ${#missing_blobs[@]} )); then
            unique=()
            while IFS= read -r object_id; do unique+=("$object_id"); done < <(printf '%s\n' "${missing_blobs[@]}" | sort -u)
            missing_blobs=("${unique[@]}")
            printf 'RETAINED_HYDRATION_BODY_FETCH_START objects=%s\n' "${#missing_blobs[@]}"
            git -c gc.auto=0 fetch --no-tags --depth=1 origin "${missing_blobs[@]}"
            echo 'RETAINED_HYDRATION_BODY_FETCH_COMPLETE'
          fi
          # BEGIN retained commit/blob batch checks
          # Keep every exact binding and its order; missing or wrong types fail closed.
          type_checks=()
          for binding in "${bindings[@]}"; do
            type_checks+=("${binding%%:*}^{commit}" "$binding")
          done
          printf '%s\n' "${type_checks[@]}" |
            git -c remote.origin.promisor=false cat-file --buffer --batch-check='%(objecttype)' |
            python3 -c 'import sys; rows=sys.stdin.read().splitlines(); count=int(sys.argv[1]); expected=[kind for _ in range(count) for kind in ("commit", "blob")]; sys.exit(0 if rows == expected else "Exact retained commit/blob types missing or mismatched")' "${#bindings[@]}"
          # END retained commit/blob batch checks
          echo 'RETAINED_HYDRATION_TYPE_CHECK_COMPLETE'

      - name: Fetch exact retained containment source
        if: hashFiles('scripts/build_india_guarded_rollback.py') != ''
        timeout-minutes: 2
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          frozen_source=4dc9e8fd3f9eafd28445b408d376b73634ccfa56
          # The bounded admission step above hydrates this immutable source.
          git -c remote.origin.promisor=false cat-file -e "$frozen_source^{commit}" || exit 1
          [[ "$(git -c remote.origin.promisor=false cat-file -t "$frozen_source:backend/server.py")" == blob ]] || exit 1
          [[ "$(git rev-parse "$frozen_source:backend")" == '0be169311c1a344dc297be93af80e43857850808' ]] || exit 1

      - name: Fetch exact approved purchase guard source
        if: hashFiles('internal/legal/purchase_guard_source.json') != ''
        timeout-minutes: 4
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          source_pin="$(jq -er '.approved_merged_584_sha' internal/legal/purchase_guard_source.json)"
          source_hash="$(jq -er '.approved_base_server_sha256' internal/legal/purchase_guard_source.json)"
          [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$source_hash" =~ ^[0-9a-f]{64}$ ]] || exit 1
          git -c remote.origin.promisor=false cat-file -e "$source_pin:backend/server.py"
          [[ "$(git show "$source_pin:backend/server.py" | sha256sum | awk '{print $1}')" == "$source_hash" ]]
          guard_schema="$(jq -er '.schema' internal/legal/purchase_guard_source.json)"
          if [[ "$guard_schema" == 'earnalism.purchase-guard-source.v2' || "$guard_schema" == 'earnalism.purchase-guard-source.v3' ]]; then
            application_pin="$(jq -er '.application_source_sha' internal/legal/purchase_guard_source.json)"
            application_hash="$(jq -er '.application_server_sha256' internal/legal/purchase_guard_source.json)"
            [[ "$application_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$application_hash" =~ ^[0-9a-f]{64}$ ]] || exit 1
            git -c remote.origin.promisor=false cat-file -e "$application_pin:backend/server.py"
            [[ "$(git show "$application_pin:backend/server.py" | sha256sum | awk '{print $1}')" == "$application_hash" ]]
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Set up Python for isolated UAT
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Qualify immutable Reader612 recovery source without deployment
        if: hashFiles('internal/release/reader612_native_preparation.json') != ''
        timeout-minutes: 5
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: '1'
          REDIS_CACHE_ENABLED: 'false'
          REDIS_PUBLIC_METADATA_ENABLED: 'false'
          MULTI_REPLICA_ENABLED: 'false'
        run: |
          set -euo pipefail
          binding=internal/release/reader612_native_preparation.json
          for field in source_sha application_base prior_reader_source; do
            source_pin="$(jq -er ".$field" "$binding")"
            [[ "$source_pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git -c remote.origin.promisor=false cat-file -e "$source_pin^{commit}"
          done
          git worktree add --detach --no-checkout "$RUNNER_TEMP/reader612-closed-source" "$(jq -er '.source_sha' "$binding")"
          printf '%s\n' '/backend/' '/internal/legal/purchase_guard_source.json' '/internal/legal/purchase_guard_owner_acceptance.json' '/internal/legal/reader612_recovery_source.json' '/.gitignore' '/.gitattributes' | git -C "$RUNNER_TEMP/reader612-closed-source" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/reader612-closed-source" read-tree -mu HEAD
          python3 -m scripts.reader612_recovery_source --source-root "$RUNNER_TEMP/reader612-closed-source" --binding "$binding"
          python3 -m unittest scripts.test_reader612_recovery_source scripts.test_reader612_native_restore scripts.test_reader612_native_observer scripts.test_reader612_protected_approval scripts.test_reader612_phase_bridge scripts.test_reader612_phase_collectors -v

      - name: Qualify paired archive helper and content provenance (no providers)
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 10
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          package=scripts/test_helpers/railway_archiver_v5710
          export CARGO_TARGET_DIR="$RUNNER_TEMP/paired-helper-cargo-target"
          python3 -m unittest scripts.test_verify_railway_helper_archive scripts.test_verify_railway_helper_source scripts.test_diagnose_railway_helper_lock scripts.test_paired_backend_content_provenance scripts.test_india_release_provider_adapter scripts.test_current_guarded_bootstrap_restore scripts.test_current_frontend_restore scripts.test_retained_startup_channel scripts.test_guarded_release_controller scripts.test_private_frontend_stage scripts.test_first_guard_pair scripts.test_reader_owner_applicability scripts.test_sredni_build_amendment scripts.test_native_action_scope scripts.test_first_guard_pair_regressions scripts.test_first_guard_financial_io -v
          rustc --version
          cargo --version
          python3 -c 'import re,subprocess; v=re.match(r"rustc (\d+)\.(\d+)\.(\d+)",subprocess.check_output(["rustc","--version"],text=True)); assert v and tuple(map(int,v.groups())) >= (1,85,0), "Rust >=1.85 required; no automatic installation"'
          python3 scripts/verify_railway_helper_source.py --root "$package"
          mkdir -p "$RUNNER_TEMP/paired-helper-proof"
          if cargo build --locked --release --manifest-path "$package/Cargo.toml"; then
            :
          else
            locked_build_status=$?
            python3 scripts/diagnose_railway_helper_lock.py --package-root "$package" --output-dir "$RUNNER_TEMP/paired-helper-proof/cargo-lock-diagnostic" || true
            exit "$locked_build_status"
          fi
          mkdir -p "$RUNNER_TEMP/paired-helper-proof"
          python3 scripts/run_railway_helper_fixture_checks.py --binary "$CARGO_TARGET_DIR/release/earnalism-railway-archiver-test" --output "$RUNNER_TEMP/paired-helper-proof/fixtures.json"
          python3 - <<'PYEXPORT'
          import hashlib,json,os
          from pathlib import Path
          from scripts.purchase_guard_source import validate_paired_source,backend_tree,_git_blob
          from scripts.backend_upload_payload import qualify_committed_export
          # BEGIN explicit historical controller export (source CI only)
          current=Path.cwd(); reference=os.environ['HISTORICAL_PAIR_CONTROLLER_SHA']
          controller=Path(os.environ['RUNNER_TEMP'])/'paired-helper-historical-controller'
          import subprocess
          subprocess.run(['git','worktree','add','--detach','--no-checkout',str(controller),reference],cwd=current,check=True)
          patterns='/backend/\n/scripts/build_runtime_source_manifest.py\n/internal/legal/purchase_guard_source.json\n/internal/legal/purchase_guard_owner_acceptance.json\n/.gitignore\n/.gitattributes\n'
          subprocess.run(['git','-C',str(controller),'sparse-checkout','set','--no-cone','--stdin'],input=patterns,text=True,check=True)
          subprocess.run(['git','-C',str(controller),'read-tree','-mu','HEAD'],check=True)
          assert json.loads((controller/'internal/legal/purchase_guard_source.json').read_text())['application_source_sha']==os.environ['HISTORICAL_PAIR_APPLICATION_SHA']
          pair=validate_paired_source(controller); b=pair['bootstrap_source_sha']
          assert pair['controller_source_sha']==reference and b==os.environ['HISTORICAL_PAIR_BOOTSTRAP_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=controller,text=True).strip()==os.environ['HISTORICAL_PAIR_CONTROLLER_TREE']
          context={'scope':'HISTORICAL_C_B65_ONLY_NOT_CURRENT_CI_BACKEND_RECOVERY','ci_checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=current,text=True).strip(),'historical_controller_sha':reference,'bootstrap_source_sha':b,'current_candidate_recovery_qualified':False,'current_candidate_or_provider_recovery_qualified':False}
          (Path(os.environ['RUNNER_TEMP'])/'paired-helper-proof/historical-context.json').write_text(json.dumps(context,indent=2)+'\n')
          # END explicit historical controller export
          if json.loads((current/'internal/legal/purchase_guard_source.json').read_text())['guarded_bootstrap_source_sha'] != os.environ['HISTORICAL_PAIR_BOOTSTRAP_SHA']:
              retained=Path(os.environ['RUNNER_TEMP'])/'paired-helper-retained-controller'
              retained_ref=os.environ['RETAINED_PAIR_CONTROLLER_SHA']
              subprocess.run(['git','worktree','add','--detach','--no-checkout',str(retained),retained_ref],cwd=current,check=True)
              subprocess.run(['git','-C',str(retained),'sparse-checkout','set','--no-cone','--stdin'],input=patterns,text=True,check=True)
              subprocess.run(['git','-C',str(retained),'read-tree','-mu','HEAD'],check=True)
              assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=retained,text=True).strip()==os.environ['RETAINED_PAIR_CONTROLLER_TREE']
              current_pair=validate_paired_source(retained)
              assert current_pair['controller_source_sha']==retained_ref
              assert current_pair['bootstrap_source_sha']==json.loads((current/'internal/legal/purchase_guard_source.json').read_text())['guarded_bootstrap_source_sha']
              for custody_path in ('internal/legal/purchase_guard_source.json','internal/legal/purchase_guard_owner_acceptance.json'):
                  assert (retained/custody_path).read_bytes()==(current/custody_path).read_bytes()
              retained_context={'scope':'RETAINED_PAIR_ONLY_NOT_CURRENT_CANDIDATE_RECOVERY','ci_checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=current,text=True).strip(),'retained_controller_sha':retained_ref,'current_candidate_recovery_qualified':False,'current_candidate_or_provider_recovery_qualified':False}
              (Path(os.environ['RUNNER_TEMP'])/'paired-helper-proof/retained-context.json').write_text(json.dumps(retained_context,indent=2)+'\n')
              (Path(os.environ['RUNNER_TEMP'])/'paired-helper-proof/current-source-pair.json').write_text(json.dumps(current_pair,indent=2)+'\n')
          root=Path(os.environ['RUNNER_TEMP'])/'paired-helper-export'; root.mkdir(mode=0o700)
          rows=backend_tree(controller,b)
          for name,row in rows.items():
              target=root/name; target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              target.write_bytes(_git_blob(controller,b,name)); target.chmod(0o755 if row['mode']=='100755' else 0o644)
          ignore=_git_blob(controller,b,'.gitignore'); (root/'.gitignore').write_bytes(ignore)
          report=qualify_committed_export(controller,b,root)
          assert set(r['path'] for r in report['files'])==set(rows), 'full B membership required; no implicit ignore projection'
          out=Path(os.environ['RUNNER_TEMP'])/'paired-helper-proof/offline-export-report.json'; out.write_text(json.dumps(report,indent=2)+'\n')
          (out.parent/'offline-export-report.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest())
          PYEXPORT
          python3 scripts/execute_railway_helper_check.py --package-root "$package" --binary "$CARGO_TARGET_DIR/release/earnalism-railway-archiver-test" --report "$RUNNER_TEMP/paired-helper-proof/offline-export-report.json" --expected-report-sha256 "$(cat "$RUNNER_TEMP/paired-helper-proof/offline-export-report.sha256")" --export-root "$RUNNER_TEMP/paired-helper-export" --controller-root "$RUNNER_TEMP/paired-helper-historical-controller" --output-dir "$RUNNER_TEMP/paired-helper-proof/executed"
          # Reuse the same compiled helper, but never relabel its old B65 input.
          if [[ "$(jq -er '.guarded_bootstrap_source_sha' internal/legal/purchase_guard_source.json)" != "$HISTORICAL_PAIR_BOOTSTRAP_SHA" ]]; then
            python3 - <<'PYCURRENTEXPORT'
          import hashlib,json,os
          from pathlib import Path
          from scripts.purchase_guard_source import validate_paired_source,backend_tree,_git_blob
          from scripts.backend_upload_payload import qualify_committed_export
          controller=Path(os.environ['RUNNER_TEMP'])/'paired-helper-retained-controller'
          pair=validate_paired_source(controller); source=pair['bootstrap_source_sha']
          assert pair['controller_source_sha']==os.environ['RETAINED_PAIR_CONTROLLER_SHA']
          root=Path(os.environ['RUNNER_TEMP'])/'paired-helper-current-export'; root.mkdir(mode=0o700)
          rows=backend_tree(controller,source)
          for name,row in rows.items():
              target=root/name; target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              target.write_bytes(_git_blob(controller,source,name)); target.chmod(0o755 if row['mode']=='100755' else 0o644)
          (root/'.gitignore').write_bytes(_git_blob(controller,source,'.gitignore'))
          report=qualify_committed_export(controller,source,root)
          assert set(r['path'] for r in report['files'])==set(rows), 'full current CLOSED membership required'
          assert report['runtime_expected_sha256']==pair['closed_runtime_sha256']
          out=Path(os.environ['RUNNER_TEMP'])/'paired-helper-proof/current-offline-export-report.json'
          out.write_text(json.dumps(report,indent=2)+'\n')
          out.with_suffix('.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest())
          PYCURRENTEXPORT
            python3 scripts/execute_railway_helper_check.py --package-root "$package" --binary "$CARGO_TARGET_DIR/release/earnalism-railway-archiver-test" --report "$RUNNER_TEMP/paired-helper-proof/current-offline-export-report.json" --expected-report-sha256 "$(cat "$RUNNER_TEMP/paired-helper-proof/current-offline-export-report.sha256")" --export-root "$RUNNER_TEMP/paired-helper-current-export" --controller-root "$RUNNER_TEMP/paired-helper-retained-controller" --output-dir "$RUNNER_TEMP/paired-helper-proof/current-executed"
          fi

      - name: Retain paired helper evidence (not native upload proof)
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: paired-helper-proof
          path: |
            ${{ runner.temp }}/paired-helper-proof
            !${{ runner.temp }}/paired-helper-proof/cargo-lock-diagnostic/package/**
          if-no-files-found: error

      - name: Install launcher and native-audio test prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ripgrep ffmpeg

      - name: Validate content-aware audiobook scoring and mixing
        run: python3 -m unittest scripts.test_audiobook_score scripts.test_audiobook_score_renderer -v

      - name: Validate private book audiovisual and learned-rig source
        run: |
          python3 -m pip install numpy==2.2.6 Pillow==11.2.1
          python3 -m unittest scripts.test_book_audiovisual scripts.test_book_av_render scripts.original_motion.test_motion_model scripts.original_motion.test_learned_rig_render scripts.original_motion.test_contact_retarget -v

      - name: Validate retained successor editorial admission
        run: python3 -m unittest discover -s internal/audiobook_lab/scripts -p test_open_window_successor_acceptance.py -v

      - name: Validate exact retained-master derivative admission
        run: |
          python3 -m unittest discover -s internal/audiobook_lab/scripts -p test_retained_master_derivative.py -v
          python3 -m unittest discover -s internal/audiobook_lab/scripts -p test_native_scored_package.py -v
          python3 -m unittest discover -s internal/audiobook_lab/scripts -p test_selfish_cedar_source_adoption.py -v
          python3 -m unittest discover -s backend/tests -p test_exact_retained_master_duration.py -v

      - name: Validate catalogue worker permission boundaries
        run: python3 -m unittest scripts.test_reader_benchmark_runner scripts.test_catalogue_compliance_workflow_cost scripts.test_catalogue_compliance_worker_permissions scripts.test_catalogue_compliance_worker_receipt scripts.test_catalogue_compliance_generated_evidence scripts.test_catalogue_compliance_batch scripts.test_catalogue_compliance_controller_evidence -v

      - name: Validate historical unavailable snapshots and raw HTML canary
        run: python3 -m unittest scripts.test_post_deploy_static_seo_canary scripts.test_manual_production_release_workflow scripts.test_verify_isolated_seo_build scripts.test_frontend_build_qualification scripts.test_complete_release_capture scripts.test_verify_build_dependency_identity scripts.test_frontend_public_build scripts.test_verify_backend_release scripts.test_frontend_only_provider_evidence scripts.test_vercel_readonly_access scripts.test_backend_identity_diagnostic scripts.test_reader_startup_readonly -v

      - name: Validate additive health attestation in isolated ASGI
        run: |
          python3 -m pip install pytest fastapi==0.110.1 httpx==0.28.1
          python3 -m pytest backend/tests/test_deployment_attestation.py -q

      - name: Run complete local UAT launcher suite
        run: |
          command -v bash node python3 rg shasum
          bash --version
          node --version
          python3 --version
          rg --version
          shasum --version
          env -u REACT_APP_BACKEND_URL -u REACT_APP_API_URL -u SEO_API_BASE_URL \
            bash scripts/test_local_uat_launcher.sh

      - name: Run UAT report-preservation tests
        run: |
          python3 -m unittest scripts/test_generate_system_uat_report.py
          bash scripts/test_system_uat_failure_propagation.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name earnalism-uat-mongodb --network host mongo:7.0.14 bash -c 'set -euo pipefail; umask 077; head -c 512 /dev/urandom | base64 > /tmp/uat-keyfile; exec mongod --auth --keyFile /tmp/uat-keyfile --bind_ip 127.0.0.1 --port 27018 --replSet earnalism-uat-rs0'
          for _ in $(seq 1 30); do
            docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'db.adminCommand({ ping: 1 })' && break
            sleep 1
          done
          docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'try { rs.initiate({_id: "earnalism-uat-rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }]}) } catch (error) { if (error.codeName !== "AlreadyInitialized") throw error }'

      - name: Start isolated Redis
        run: docker run --detach --name earnalism-uat-redis --network host redis:8.2.1 redis-server --bind 127.0.0.1 --port 26379 --save '' --appendonly no

      - name: Report bounded isolated-runner disk usage
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          for item in .npm-cache .pip-cache node_modules frontend/node_modules .playwright-browsers .venv-uat; do
            if [ -e "$item" ]; then du -sh -- "$item"; fi
          done

      - name: Run isolated current-commit pre-deploy regression
        env:
          UAT_EXTERNAL_MONGODB: true
          UAT_EXTERNAL_REDIS: true
          NODE_ENV: production
        run: bash scripts/run_pr_regression.sh

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm --force earnalism-uat-mongodb earnalism-uat-redis

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-artifacts
          path: |
            regression/results.json
            regression/artifacts/**

      - name: PR summary comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('regression/results.json', 'utf8'));
            const report = raw.regression || raw;
            const body = [
              '### Regression module scores',
              '',
              ...report.modules.map((m) => `- ${m.score === 100 ? 'PASS' : 'FAIL'} ${m.score}: ${m.moduleName}`),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  frontend_build_only:
    name: Linux frontend build and packaging only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_only == true &&
      github.repository == 'ronik18/earnalism-digital-library' &&
      github.ref == 'refs/heads/codex/reader-only-strict-fit-20261017' &&
      inputs.target_sha == github.sha &&
      inputs.confirm_production == 'BUILD_AND_PACKAGE_ONLY'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONTROLLER_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout exact approved controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, retained resolved revision
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use reviewed Node and npm runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.2'

      - name: Use Python for local verifiers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run credential-free local build qualification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/codex/reader-only-strict-fit-20261017' ]] || exit 1
          [[ "$CONTROLLER_SHA" == "$GITHUB_SHA" ]] || exit 1
          python3 -m scripts.qualify_frontend_build_only --controller-sha "$CONTROLLER_SHA" --output-root "$RUNNER_TEMP/frontend-build-only-$GITHUB_RUN_ID"

      - name: Record explicit incomplete-capture marker if needed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / ('frontend-build-only-' + os.environ['GITHUB_RUN_ID']) / 'upload'
          out.mkdir(parents=True, exist_ok=True)
          if not (out / 'release-candidate.zip').exists() and not (out / 'CAPTURE-FAILURE.json').exists():
              (out / 'CAPTURE-FAILURE.json').write_text(json.dumps({'status':'HOLD_CAPTURE_NOT_COMPLETED','no_automatic_retry':True}))
          PY

      - name: Retain complete bounded public capture or explicit failure marker
        if: always()
        id: capture_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-build-only-${{ github.run_id }}/upload/
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Verify actual hosted artifact size
        if: steps.capture_upload.outputs.artifact-id != ''
        env:
          CAPTURE_ARTIFACT_ID: ${{ steps.capture_upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          artifact_id = os.environ['CAPTURE_ARTIFACT_ID']
          assert artifact_id.isdecimal()
          url = 'https://api.github.com/repos/ronik18/earnalism-digital-library/actions/artifacts/' + artifact_id
          with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept':'application/vnd.github+json'}), timeout=20) as response:
              metadata = json.load(response)
          assert metadata['size_in_bytes'] <= 64 * 1024 * 1024
          print(json.dumps({'artifact_id':artifact_id,'actual_compressed_bytes':metadata['size_in_bytes'],'status':'PASS_SIZE_ONLY_PENDING_IMMEDIATE_INDEPENDENT_DOWNLOAD'}))
          PY
