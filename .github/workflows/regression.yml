name: GO LIVE regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: go-live-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: ci
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Set up Python for isolated UAT
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name earnalism-uat-mongodb --network host mongo:7.0.14 mongod --bind_ip 127.0.0.1 --port 27018 --replSet earnalism-uat-rs0
          for _ in $(seq 1 30); do
            docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'db.adminCommand({ ping: 1 })' && break
            sleep 1
          done
          docker exec earnalism-uat-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'try { rs.initiate({_id: "earnalism-uat-rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }]}) } catch (error) { if (error.codeName !== "AlreadyInitialized") throw error }'

      - name: Start isolated Redis
        run: docker run --detach --name earnalism-uat-redis --network host redis:8.2.1 redis-server --bind 127.0.0.1 --port 26379 --save '' --appendonly no

      - name: Run isolated current-commit pre-deploy regression
        env:
          UAT_EXTERNAL_MONGODB: true
          UAT_EXTERNAL_REDIS: true
          NODE_ENV: production
        run: bash scripts/run_pr_regression.sh

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm --force earnalism-uat-mongodb earnalism-uat-redis

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-artifacts
          path: |
            regression/results.json
            regression/artifacts/**

      - name: PR summary comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('regression/results.json', 'utf8'));
            const report = raw.regression || raw;
            const body = [
              '### Regression module scores',
              '',
              ...report.modules.map((m) => `- ${m.score === 100 ? 'PASS' : 'FAIL'} ${m.score}: ${m.moduleName}`),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  deploy_frontend:
    name: Vercel frontend deploy after pre-deploy pass
    needs: regression
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.vercel-check.outputs.enabled }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE || vars.VERCEL_SCOPE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Vercel deploy scope and secrets
        id: vercel-check
        shell: bash
        run: |
          before_sha="${{ github.event.before }}"
          if [[ ! "${before_sha}" =~ ^[0-9a-f]{40}$ ]] || [[ "${before_sha}" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}"; then
            before_sha="$(git rev-list --max-parents=0 "${GITHUB_SHA}" | tail -1)"
          fi
          echo "scope_base=${before_sha}"
          echo "scope_head=${GITHUB_SHA}"
          if git diff --quiet "${before_sha}" "${GITHUB_SHA}" -- frontend; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Vercel frontend deploy skipped: no frontend files changed."
          elif [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Vercel frontend deploy skipped: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing."
          fi

      - name: Set up Node
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.enabled == 'true'
        run: npm install -g vercel@latest

      - name: Link Vercel project
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p .vercel
          node - <<'NODE'
          const fs = require('fs');

          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }, null, 2)}\n`,
          );
          NODE

      - name: Pull Vercel production environment
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          args=(pull --yes --environment=production --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

      - name: Build frontend for Vercel
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          rm -rf .vercel/output
          args=(build --prod --yes --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

      - name: Deploy frontend to Vercel production
        if: steps.vercel-check.outputs.enabled == 'true'
        shell: bash
        run: |
          args=(deploy --prebuilt --prod --token "${VERCEL_TOKEN}")
          if [[ -n "${VERCEL_SCOPE}" ]]; then
            args+=(--scope "${VERCEL_SCOPE}")
          fi
          vercel "${args[@]}"

  frontend_production_canary:
    name: Vercel frontend production canary
    needs:
      - regression
      - deploy_frontend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success' &&
      needs.deploy_frontend.result == 'success' &&
      needs.deploy_frontend.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed frontend commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install canary dependencies
        run: npm ci

      - name: Run removed-route production canary
        run: python3 scripts/post_deploy_route_canary.py --base-url https://theearnalism.com

      - name: Run static SEO raw-HTML canary
        run: python3 scripts/post_deploy_static_seo_canary.py --base-url https://theearnalism.com

      - name: Run frontend production regression canary
        env:
          REGRESSION_MODE: canary
          REGRESSION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://theearnalism.com' }}
          REGRESSION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.theearnalism.com' }}
        run: node regression/scripts/post-deploy-canary.js

      - name: Upload frontend canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-production-canary-${{ github.sha }}
          path: |
            output/launch/post_deploy_route_canary.*
            output/launch/post_deploy_static_seo_canary.*
            regression/results.json
