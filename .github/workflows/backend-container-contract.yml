name: Backend container contract

on:
  pull_request:
    branches: [main]
    paths:
      - backend/Dockerfile
      - backend/railway.json
      - backend/start_prod.sh
      - backend/requirements-runtime.txt
      - .github/workflows/regression.yml
      - .github/workflows/railway-deployment-canary.yml
      - .github/workflows/backend-container-contract.yml
  push:
    branches: [main]
    paths:
      - backend/Dockerfile
      - backend/railway.json
      - backend/start_prod.sh
      - backend/requirements-runtime.txt
      - .github/workflows/regression.yml
      - .github/workflows/railway-deployment-canary.yml
      - .github/workflows/backend-container-contract.yml

permissions:
  contents: read

jobs:
  backend_container_contract:
    name: Docker build and health contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install isolated fixture driver
        run: python3 -m pip install pymongo==4.5.0

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name earnalism-container-mongodb --network host mongo:7.0.14 bash -c 'set -euo pipefail; umask 077; head -c 512 /dev/urandom | base64 > /tmp/uat-keyfile; exec mongod --auth --keyFile /tmp/uat-keyfile --bind_ip 127.0.0.1 --port 27018 --replSet earnalism-uat-rs0'
          for _ in $(seq 1 30); do
            docker exec earnalism-container-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'db.adminCommand({ ping: 1 })' && break
            sleep 1
          done
          export ENVIRONMENT=uat DB_NAME=earnalism_uat UAT_MONGODB_PORT=27018
          export UAT_MONGO_FIXTURE_DIR="$RUNNER_TEMP/earnalism-container-fixture"
          mkdir -m 700 "$UAT_MONGO_FIXTURE_DIR"
          python3 scripts/init_uat_mongodb.py
          python3 scripts/prepare_uat_startup_guard.py

      - name: Build the Railway root-directory context
        run: docker build --file backend/Dockerfile --tag earnalism-backend-ci backend

      - name: Validate image user, port, startup, and health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend-container-contract
          docker image inspect earnalism-backend-ci > backend-container-contract/image-inspect.json
          test "$(docker image inspect --format '{{.Config.User}}' earnalism-backend-ci)" = "app"
          source "$RUNNER_TEMP/earnalism-container-fixture/startup-guard.env"
          docker run --detach --name earnalism-backend-ci --network host \
            --env PORT=8080 \
            --env ENVIRONMENT=uat \
            --env MONGODB_URL --env DB_NAME --env EARNALISM_STARTUP_DATA_GUARD_JSON \
            --env JWT_SECRET='synthetic-container-contract-only' \
            --env ADMIN_EMAIL='container-contract@example.invalid' \
            --env ENABLE_STARTUP_DB_MAINTENANCE=false \
            earnalism-backend-ci
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz > backend-container-contract/healthz.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz > backend-container-contract/healthz.json
          docker exec earnalism-backend-ci sh -c 'test "$(id -u)" -ne 0 && test "${PORT}" = 8080 && python -c "import server"'
          ! docker image inspect earnalism-backend-ci | grep -q '127.0.0.1:8000\|:8000/healthz'
          docker logs earnalism-backend-ci > backend-container-contract/container.log 2>&1

      - name: Collect container evidence
        if: always()
        run: |
          docker ps -a > backend-container-contract/docker-ps.txt || true
          docker logs earnalism-backend-ci > backend-container-contract/container.log 2>&1 || true
          docker rm --force earnalism-backend-ci earnalism-container-mongodb || true
          rm -f "$RUNNER_TEMP/earnalism-container-fixture/startup-guard.env" "$RUNNER_TEMP/earnalism-container-fixture/startup-guard-setup.json"

      - name: Upload compact container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-container-contract-${{ github.sha }}
          path: backend-container-contract/**
