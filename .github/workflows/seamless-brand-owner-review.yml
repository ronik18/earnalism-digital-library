name: Seamless brand owner review

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/components/EarnalismBrandLockup.*
      - frontend/src/components/Header.*
      - frontend/src/components/Footer.*
      - frontend/src/experiences-v2/**
      - frontend/src/styles/auth-account.css
      - scripts/audit_seamless_brand_placements.mjs
      - .github/workflows/seamless-brand-owner-review.yml

permissions:
  contents: read

jobs:
  seamless-brand-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      REACT_APP_BACKEND_URL: http://127.0.0.1:18007/api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact checkout and install pinned dependencies
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          npm ci --prefix frontend --legacy-peer-deps
          npx playwright install --with-deps chromium firefox webkit
      - name: Audit canonical lockup placements
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm --prefix frontend run build
          node scripts/serve_frontend_build.js --port 13019 > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:13019/ >/dev/null && break; sleep 1; done
          UAT_BASE_URL=http://127.0.0.1:13019 SEAMLESS_BRAND_CAPTURE_OUTPUT=uat/evidence/seamless-brand-pilot/current node scripts/capture_seamless_brand_owner_review.mjs
          python3 scripts/generate_seamless_brand_owner_review.py uat/evidence/seamless-brand-pilot/current
          python3 scripts/validate_seamless_brand_owner_review.py uat/evidence/seamless-brand-pilot/current
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr344-seamless-brand-final-review-${{ github.event.pull_request.head.sha }}
          path: |
            uat/evidence/seamless-brand-pilot/**
            ${{ runner.temp }}/server.log
          if-no-files-found: error
