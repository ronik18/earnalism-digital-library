name: Vercel function packaging
on:
  pull_request:
    branches: [main]
    paths:
      - '.vercelignore'
      - 'frontend/vercel.json'
      - 'frontend/api/**'
      - 'scripts/verify_vercel_packaging.py'
      - 'scripts/test_verify_vercel_packaging.py'
      - '.github/workflows/vercel-packaging.yml'
      - '.github/workflows/regression.yml'
permissions:
  contents: read
jobs:
  packaging:
    name: function packaging guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m unittest scripts.test_verify_vercel_packaging -v
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: npm run build --prefix frontend
      - run: npm install -g vercel@62.1.0
      - name: Use existing Vercel project linkage
        run: |
          test -n "${VERCEL_ORG_ID}" && test -n "${VERCEL_PROJECT_ID}"
          mkdir -p .vercel
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          }));
          NODE
      - name: Verify actual source deployment manifest
        run: |
          test -n "${VERCEL_TOKEN}"
          vercel deploy --dry --format=json --token "${VERCEL_TOKEN}" > /tmp/vercel-source-manifest.json
          python3 scripts/verify_vercel_packaging.py --manifest /tmp/vercel-source-manifest.json --output /tmp/vercel-source-packaging.json
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-source-packaging-${{ github.event.pull_request.head.sha }}
          path: /tmp/vercel-source-packaging.json
