name: Earnalism autonomy worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      task_type:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      generation:
        required: true
        type: string
      attempt:
        required: true
        type: string
      correction_context:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  worker-and-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TASK_ID: ${{ inputs.task_id }}
      TASK_TYPE: ${{ inputs.task_type }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TASK_GENERATION: ${{ inputs.generation }}
      TASK_ATTEMPT: ${{ inputs.attempt }}
      CORRECTION_CONTEXT: ${{ inputs.correction_context }}
    steps:
      - name: Check out approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded Codex SDK
        if: inputs.task_type == 'codex-implementation-fixture'
        run: npm ci --ignore-scripts
      - name: Sandbox preflight
        if: inputs.task_type == 'codex-implementation-fixture'
        run: |
          set -u
          echo "runner_os=$RUNNER_OS"
          echo "runner_environment=$RUNNER_ENVIRONMENT"
          echo "bwrap_version=$(bwrap --version)"
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo unavailable)"
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)"
          if unshare -Ur true; then
            echo "sandbox_namespace_probe=PASS"
          else
            echo "sandbox_namespace_probe=requires_official_action_preflight"
          fi
      - name: Run official Codex Action
        if: inputs.task_type == 'codex-implementation-fixture'
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.EARNALISM_CODEX_OPENAI_API_KEY }}
          model: gpt-5.6-luna
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            In the isolated bridge_fixtures/codex_acceptance_fixture.py only, perform the bounded fixture task for attempt ${{ inputs.attempt }}. On attempt 1 set LABEL to ready and leave format_label unchanged. On attempt 2 apply the reviewer correction so format_label returns the uppercase label. Do not touch any other path. Run python3 scripts/codex_fixture_test.py and make the source edit rather than only describing it.
      - name: Run bounded worker
        id: legacy-worker
        if: inputs.task_type != 'codex-implementation-fixture'
        run: >-
          python scripts/autonomy_worker.py --task-id "$TASK_ID"
          --task-type "$TASK_TYPE" --candidate-sha "$CANDIDATE_SHA"
          --generation "$TASK_GENERATION" --attempt "$TASK_ATTEMPT"
          --correction-context "$CORRECTION_CONTEXT"
          --output worker-result.json
      - name: Package official Codex result
        id: worker
        if: inputs.task_type == 'codex-implementation-fixture'
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
        run: |
          python - <<'PY'
          import json, os
          json.dump({'executor':'openai-codex-action','task_id':os.environ['TASK_ID'],'attempt':int(os.environ['TASK_ATTEMPT']),'summary':os.environ.get('CODEX_FINAL_MESSAGE',''),'usage':None}, open('codex-result.json','w'), indent=2)
          PY
          python scripts/autonomy_worker.py --task-id "$TASK_ID" --task-type "$TASK_TYPE" --candidate-sha "$CANDIDATE_SHA" --generation "$TASK_GENERATION" --attempt "$TASK_ATTEMPT" --correction-context "$CORRECTION_CONTEXT" --codex-result codex-result.json --output worker-result.json
        env:
          EARNALISM_CODEX_OPENAI_API_KEY: ${{ secrets.EARNALISM_CODEX_OPENAI_API_KEY }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      - name: Review worker evidence
        if: always() && steps.worker.outcome == 'success'
        run: >-
          python scripts/autonomy_reviewer.py --task-id "$TASK_ID"
          --candidate-sha "$CANDIDATE_SHA" --generation "$TASK_GENERATION"
          --attempt "$TASK_ATTEMPT"
          --task-type "$TASK_TYPE"
          --worker-result worker-result.json --output review-result.json
      - name: Write structured failure result
        if: always() && steps.worker.outcome != 'success'
        run: |
          python - <<'PY'
          import json, os
          json.dump({'task_id': os.environ['TASK_ID'], 'tested_revision': os.environ['CANDIDATE_SHA'], 'generation': int(os.environ['TASK_GENERATION']), 'attempt': int(os.environ['TASK_ATTEMPT']), 'decision': 'CHANGES_REQUIRED', 'findings': ['worker execution failed before producing a result']}, open('review-result.json', 'w'), indent=2)
          PY
      - name: Publish durable result
        if: always()
        env:
          AUTOMATION_API_URL: ${{ secrets.EARNALISM_AUTOMATION_API_URL }}
          AUTOMATION_CALLBACK_TOKEN: ${{ secrets.EARNALISM_AUTOMATION_CALLBACK_TOKEN }}
        run: |
          test -n "$AUTOMATION_API_URL"
          test -n "$AUTOMATION_CALLBACK_TOKEN"
          python - <<'PY'
          import json, os, urllib.request
          review = json.load(open('review-result.json'))
          worker = json.load(open('worker-result.json')) if os.path.exists('worker-result.json') else {}
          payload = json.dumps({'tested_revision': review['tested_revision'], 'generation': int(os.environ['TASK_GENERATION']), 'attempt': int(os.environ['TASK_ATTEMPT']), 'event_id': f"worker-review-{os.environ['GITHUB_RUN_ID']}", 'decision': review['decision'], 'result': {'worker': worker, 'review': review}}).encode()
          url = f"{os.environ['AUTOMATION_API_URL'].rstrip('/')}/api/automation/tasks/{os.environ['TASK_ID']}/result"
          req = urllib.request.Request(url, data=payload, method='POST', headers={'Authorization': f"Bearer {os.environ['AUTOMATION_CALLBACK_TOKEN']}", 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=15) as response:
              print(response.read().decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earnalism-autonomy-${{ inputs.task_id }}-${{ github.run_id }}
          path: '*-result.json'
