      reading_pass_v2_enabled: false
      dedicated_token_secret_reported_configured: true
      baseline_public_reader_titles_reported: 45
      baseline_active_manifests_reported: 45
      baseline_segments_reported: 2830
      baseline_parity_reported: 45_of_45
      focused_v2_tests_reported_passed: 35
      counts_are_historical_inputs_not_current_authority: true
      must_recompute_before_rollout: true
    completion_state: P1_READER_AVAILABILITY_DEPLOYED_HEALTHY
  permissions:
    repository:
      read_all_current_policy_and_code: true
      create_policy_branch: true
      create_focused_implementation_branches: true
      create_commits: true
      push_non_main_branches: true
      create_pull_requests: true
      create_issues_and_comments: true
      merge_when_all_machine_gates_pass: true
      update_modernization_state: true
      update_customer_ready_state: true
    continuous_integration:
