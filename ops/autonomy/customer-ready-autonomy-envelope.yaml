      - git_push_force
      - direct_push_to_main
      - administrator_merge_bypass
      - redis_FLUSHALL
      - redis_FLUSHDB
      - redis_KEYS_wildcard
      - production_redis_MONITOR
      - unmanifested_bulk_deletion
