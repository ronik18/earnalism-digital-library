apiVersion: earnalism.dev/v1
kind: AutonomyEnvelope
metadata:
  id: AE-CUSTOMER-READY-2026-09-05
  name: earnalism-customer-ready-autonomous-execution
  version: 1
  status: proposed_until_merged
  owner_authorization:
    purpose: Complete the CUSTOMER_READY program within this envelope after normal merge.
    may_not_be_broadened_by_agent: true
  effective_when:
    repository: ronik18/earnalism-digital-library
    branch: main
    condition: this_exact_file_is_merged
  terminates_when:
    - CUSTOMER_READY
    - explicit_repository_revocation
  historical_baseline:
    minimum_required_ancestor: 075774857c14016a32963f4f00aae7091791a4ab
    meaning: P0 wrong-title containment deployed and verified
    must_reconfirm_from_current_main: true
spec:
  terminal_objective:
    state: CUSTOMER_READY
    downstream_internal_uat_occurs_after_terminal_state: true
    downstream_internal_uat_blocks_autonomous_customer_ready: false
  source_precedence:
    - current_checked_in_AGENTS_and_repository_policy
    - current_merged_main
    - current_production_deployments_and_canonical_release_truth
    - current_checked_in_product_and_architecture_contracts
    - approved_context_pack
    - this_envelope
    - historical_pull_requests_logs_and_conversation
  autonomy:
    human_approval_required_during_run: false
    routine_owner_questions_forbidden: true
    continue_until_terminal_state: true
    one_active_defect_cluster: true
    maximum_open_implementation_PRs: 1
    maximum_write_enabled_agents: 1
    read_only_parallel_agents_allowed: 4
    merge_requires_normal_branch_protection: true
    administrator_bypass_allowed: false
    force_push_allowed: false
    direct_push_to_main_allowed: false
    deploy_from_merged_main_only: true
    automatic_rollback_allowed: true
    automatic_rollback_required_on_threshold: true
  budget:
    incremental_infrastructure_spend_usd: 0
    new_paid_plans_allowed: false
    use_existing_provider_capacity_only: true
    github_actions_service_containers_allowed: true
    local_ephemeral_services_allowed: true
    dependency_cache_allowed: true
    application_state_cache_between_runs_allowed: false
    maximum_transient_retries: 2
    maximum_repairs_per_unproven_hypothesis: 2
    prefer_changed_path_tests: true
    primary_browser_for_exhaustive_checks: chromium
    secondary_browser_checks:
      - firefox_representative_critical_journeys
      - webkit_representative_critical_journeys
  approved_platform:
    frontend: existing_react_application
    backend: existing_fastapi_modular_monolith
    primary_database: existing_mongodb
    cache: existing_redis
    payments: existing_razorpay_wallet_and_ledger
    frontend_host: existing_vercel_project
    backend_host: existing_railway_project
    architecture_rewrite_allowed: false
  product_truth:
    public_text_preview:
      canonical_pages:
        first: 1
        last: 3
      server_defined: true
      independent_of_viewport_css_font_zoom_and_browser: true
    protected_text:
      starts_at_page: 4
      server_authorization_required: true
    audio_preview:
      seconds: 0
      only_when_audio_release_approved: true
    reading_pass:
      authority: server
      client_or_cache_may_grant_entitlement: false
    release_state:
      uncertain_or_unapproved: fail_closed
    title_identity:
      unrelated_title_fallback_allowed: false
      dracula_fallback_allowed: false
    protected_content:
      public_html_allowed: false
      public_manifest_allowed: false
      frontend_bundle_allowed: false
      browser_storage_allowed: false
      service_worker_cache_allowed: false
      shared_cdn_cache_allowed: false
      shared_redis_allowed: false
    commercial_truth:
      fabricated_prices_allowed: false
      fabricated_availability_allowed: false
      fabricated_reviews_or_statistics_allowed: false
