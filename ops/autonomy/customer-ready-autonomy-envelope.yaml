      trigger_normal_production_redeployment: true
      restore_previous_variable_value: true
      restore_previous_known_good_deployment: true
      create_new_paid_service: false
      create_new_paid_environment: false
    vercel:
      inspect_existing_project_and_deployments: true
      deploy_merged_main_when_frontend_changes: true
      restore_previous_known_good_deployment: true
      create_new_paid_project: false
    production_observability:
      read_deployment_status: true
      read_redacted_logs_and_metrics: true
      execute_public_read_only_http_probes: true
      execute_browser_smoke_tests: true
      inspect_response_headers: true
      inspect_key_names_types_ttls_and_sizes_when_bounded: true
      inspect_protected_values: false
    production_data:
