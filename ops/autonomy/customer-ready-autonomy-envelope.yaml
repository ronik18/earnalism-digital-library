      create_job_local_mongodb: true
      create_job_local_redis: true
      create_local_fastapi_runtime: true
      create_local_production_frontend_build: true
      create_synthetic_accounts_and_titles: true
      upload_redacted_artifacts: true
      install_supported_playwright_browsers: true
    railway:
