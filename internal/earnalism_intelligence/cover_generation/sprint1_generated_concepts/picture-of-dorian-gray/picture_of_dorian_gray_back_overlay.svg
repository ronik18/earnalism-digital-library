<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="3072" viewBox="0 0 2048 3072" role="img" aria-label="Deterministic back-cover text overlay for The Picture of Dorian Gray">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f8edcf" flood-opacity="0.28"/>
    </filter>
  </defs>
  <line x1="670" y1="795" x2="1410" y2="795" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="795" r="7" fill="#8b6428"/>
  <text x="1040" y="1163" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="49" font-weight="400" fill="#2a1b10" filter="url(#softShadow)">
    <tspan x="1040" y="1163">Oscar Wilde&#x27;s only novel is a dazzling</tspan>
<tspan x="1040" y="1232">tale of beauty, vanity, temptation, and</tspan>
<tspan x="1040" y="1301">corruption. As Dorian Gray remains</tspan>
<tspan x="1040" y="1370">outwardly untouched by age or sin, his</tspan>
<tspan x="1040" y="1439">hidden portrait becomes the terrible</tspan>
<tspan x="1040" y="1508">record of a soul consumed by indulgence</tspan>
<tspan x="1040" y="1577">and moral decay.</tspan>
  </text>
  <line x1="670" y1="1945" x2="1410" y2="1945" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="1945" r="7" fill="#8b6428"/>
  <text x="1024" y="2920" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="42" letter-spacing="1.4" fill="#ead7a5" stroke="#120d08" stroke-width="1.1" paint-order="stroke fill">Earnalism - A Reo Enterprise Venture</text>
</svg>