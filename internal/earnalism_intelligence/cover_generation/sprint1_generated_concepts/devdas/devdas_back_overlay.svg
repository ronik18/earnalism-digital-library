<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="3072" viewBox="0 0 2048 3072" role="img" aria-label="Deterministic back-cover text overlay for দেবদাস">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f8edcf" flood-opacity="0.28"/>
    </filter>
  </defs>
  <line x1="670" y1="1785" x2="1390" y2="1785" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1030" cy="1785" r="7" fill="#8b6428"/>
  <text x="1030" y="1854" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="41" font-weight="400" fill="#2a1b10" filter="url(#softShadow)">
    <tspan x="1030" y="1854">A timeless Bengali tragedy of love, hesitation,</tspan>
<tspan x="1030" y="1911">pride, and irreversible loss, Devdas follows a</tspan>
<tspan x="1030" y="1968">young man destroyed by weakness and longing.</tspan>
<tspan x="1030" y="2025">Sarat Chandra Chattopadhyay transforms personal</tspan>
<tspan x="1030" y="2082">heartbreak into one of Bengali literature&#x27;s most</tspan>
<tspan x="1030" y="2139">enduring portraits of social constraint,</tspan>
<tspan x="1030" y="2196">emotional failure, and doomed affection.</tspan>
  </text>
  <line x1="670" y1="2265" x2="1390" y2="2265" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1030" cy="2265" r="7" fill="#8b6428"/>
  <text x="1024" y="2920" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="42" letter-spacing="1.4" fill="#ead7a5" stroke="#120d08" stroke-width="1.1" paint-order="stroke fill">Earnalism - A Reo Enterprise Venture</text>
</svg>