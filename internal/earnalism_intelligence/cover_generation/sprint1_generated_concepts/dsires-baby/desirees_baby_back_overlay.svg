<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="3072" viewBox="0 0 2048 3072" role="img" aria-label="Deterministic back-cover text overlay for Désirée’s Baby">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f8edcf" flood-opacity="0.28"/>
    </filter>
  </defs>
  <line x1="720" y1="1015" x2="1360" y2="1015" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="1015" r="7" fill="#8b6428"/>
  <text x="1040" y="1273" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="49" font-weight="400" fill="#2a1b10" filter="url(#softShadow)">
    <tspan x="1040" y="1273">In a few powerful pages, Kate Chopin</tspan>
<tspan x="1040" y="1342">exposes the cruelty of prejudice, the</tspan>
<tspan x="1040" y="1411">fragility of love, and the injustice</tspan>
<tspan x="1040" y="1480">hidden beneath social respectability.</tspan>
<tspan x="1040" y="1549">Désirée’s Baby remains a masterful</tspan>
<tspan x="1040" y="1618">exploration of identity, race, and</tspan>
<tspan x="1040" y="1687">human blindness.</tspan>
  </text>
  <line x1="720" y1="1945" x2="1360" y2="1945" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="1945" r="7" fill="#8b6428"/>
  <text x="1024" y="2920" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="42" letter-spacing="1.4" fill="#ead7a5" stroke="#120d08" stroke-width="1.1" paint-order="stroke fill">Earnalism - A Reo Enterprise Venture</text>
</svg>
