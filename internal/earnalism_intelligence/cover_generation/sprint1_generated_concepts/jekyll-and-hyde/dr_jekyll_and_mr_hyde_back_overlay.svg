<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="3072" viewBox="0 0 2048 3072" role="img" aria-label="Deterministic back-cover text overlay for Dr. Jekyll and Mr. Hyde">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f8edcf" flood-opacity="0.28"/>
    </filter>
  </defs>
  <line x1="730" y1="875" x2="1350" y2="875" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="875" r="7" fill="#8b6428"/>
  <text x="1040" y="1164" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="49" font-weight="400" fill="#2a1b10" filter="url(#softShadow)">
    <tspan x="1040" y="1164">A brilliant physician and a</tspan>
<tspan x="1040" y="1233">terrifying alter ego become the twin</tspan>
<tspan x="1040" y="1302">faces of a single human soul in</tspan>
<tspan x="1040" y="1371">Stevenson&#x27;s enduring masterpiece.</tspan>
<tspan x="1040" y="1440">With gothic tension and</tspan>
<tspan x="1040" y="1509">psychological force, this short</tspan>
<tspan x="1040" y="1578">novel explores morality, repression,</tspan>
<tspan x="1040" y="1647">and the darkness hidden beneath</tspan>
<tspan x="1040" y="1716">civilized respectability.</tspan>
  </text>
  <line x1="730" y1="2005" x2="1350" y2="2005" stroke="#8b6428" stroke-width="3"/>
  <circle cx="1040" cy="2005" r="7" fill="#8b6428"/>
  <text x="1024" y="2920" text-anchor="middle" font-family="Baskerville, Georgia, serif" font-size="42" letter-spacing="1.4" fill="#ead7a5" stroke="#120d08" stroke-width="1.1" paint-order="stroke fill">Earnalism - A Reo Enterprise Venture</text>
</svg>